<!DOCTYPE html>
<html lang="gu" data-theme="light">
<head>

<title>GSEB TOPPER</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:linear-gradient(165deg,#eef2ff 0%,#fdf2f8 45%,#ecfeff 100%);--surface:#fff;--surface2:#f8fafc;--text:#0f172a;--text2:#64748b;--border:#e2e8f0;--primary:#6366f1;--primary2:#8b5cf6;--accent:#ec4899;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--header:linear-gradient(135deg,#4f46e5,#7c3aed,#db2777);--card-shadow:0 4px 24px rgba(99,102,241,.08);--glass:rgba(255,255,255,.75);--input-bg:#fff}
[data-theme="dark"]{--bg:linear-gradient(165deg,#0c0a14,#1a1025,#0c1222);--surface:#1e1b2e;--surface2:#16132a;--text:#f1f5f9;--text2:#94a3b8;--border:#2e2a45;--primary:#818cf8;--primary2:#a78bfa;--accent:#f472b6;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--header:linear-gradient(135deg,#312e81,#4c1d95,#9d174d);--card-shadow:0 4px 24px rgba(0,0,0,.45);--glass:rgba(30,27,46,.88);--input-bg:#16132a}
*{box-sizing:border-box;margin:0;padding:0}html,body{visibility:hidden}html.ready,html.ready body{visibility:visible}
/* safety: if JS fails, show page after 2s anyway */

body{font-family:'Noto Sans Gujarati',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
.hidden{display:none!important}.locked .edit-only{display:none!important}
.btn{padding:8px 16px;border-radius:12px;font-weight:600;font-size:13px;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn:active{transform:scale(.96)}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff}.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-teal{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff}.btn-sm{padding:5px 10px;font-size:11px;border-radius:8px}
.card{background:var(--surface);border-radius:20px;border:1px solid var(--border);box-shadow:var(--card-shadow)}
.chap-card{cursor:pointer;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;transition:all .2s}
.chap-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.answer-box{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(52,211,153,.08));border-left:4px solid var(--success);padding:12px;border-radius:0 12px 12px 0;margin-top:10px;font-size:13px;color:var(--success)}
.std-tab{flex:1;padding:14px 8px;text-align:center;font-weight:700;border:none;cursor:pointer;font-size:14px;font-family:inherit;color:rgba(255,255,255,.45);background:transparent}
.std-tab.active{color:#fff;background:rgba(255,255,255,.14);border-radius:12px 12px 0 0}
.sub-pill{padding:9px 14px;border-radius:999px;font-weight:600;font-size:12px;border:none;cursor:pointer;font-family:inherit}
.sub-pill.active{color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}.sub-pill:not(.active){background:var(--surface2);color:var(--text2)}
.test-option{border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:8px;cursor:pointer;background:var(--surface);font-size:14px}
.test-option.selected{background:rgba(99,102,241,.14);border-color:var(--primary);font-weight:600}
.test-option.correct{background:rgba(16,185,129,.15)!important;border-color:var(--success)!important}
.test-option.wrong{background:rgba(239,68,68,.12)!important;border-color:var(--danger)!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:400px;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;font-family:inherit;font-size:14px;background:var(--input-bg);color:var(--text);margin-bottom:10px;outline:none}
.modal-title{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:16px}
.num-badge{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.empty-chap{border:2px dashed var(--border);background:var(--surface2);border-radius:20px;padding:32px;text-align:center;color:var(--text2)}
.theme-btn{width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;font-size:18px;background:rgba(255,255,255,.15);color:#fff}
.q-card{padding:16px;margin-bottom:12px;border-radius:18px;background:var(--surface);border:1px solid var(--border)}
.info-banner{padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(245,158,11,.06));border:1px solid rgba(245,158,11,.25);margin-bottom:16px;display:flex;gap:10px;font-size:13px;line-height:1.5}
.header-premium{background:var(--header);color:#fff;position:sticky;top:0;z-index:50;padding:16px;box-shadow:0 8px 32px rgba(79,70,229,.25)}
.test-banner{padding:24px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;text-align:center;margin-bottom:20px}
.tip-card{padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.05));border:1px solid rgba(99,102,241,.2);margin-bottom:14px;font-size:13px;line-height:1.6}
.mat-card{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px}
.mat-card h4{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:8px}
.mat-card ul{padding-left:18px;font-size:13px;line-height:1.7;color:var(--text2)}
.score-pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(16,185,129,.15);color:var(--success)}
.filter-chip{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit}
.filter-chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.fb-correct{color:var(--success);font-weight:700;font-size:13px;margin-top:8px}
.fb-wrong{color:var(--danger);font-weight:700;font-size:13px;margin-top:8px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.dash-card{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:center}
.dash-card .num{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dash-card .lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:600}
.progress-bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s}

.badge-earned{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;margin:4px}
.badge-earned.on{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(251,191,36,.1));border-color:rgba(245,158,11,.4)}
.formula-card{padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.05));border:1px solid rgba(99,102,241,.2);margin-bottom:10px}
.formula-card h4{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:6px}
.timer-bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:10px 0}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--warning),var(--danger));transition:width .3s}
.quiz-q{font-size:16px;font-weight:600;line-height:1.5;margin:12px 0}
.daily-card{padding:14px;border-radius:18px;margin-bottom:12px;border:1px solid var(--border);background:var(--surface)}
.report-box{padding:16px;border-radius:16px;background:var(--surface2);font-size:13px;line-height:1.7;white-space:pre-wrap}
.glossary-item{padding:12px;border-bottom:1px solid var(--border)}
.glossary-item b{color:var(--primary)}
.vs-score{font-size:28px;font-weight:800;text-align:center}


@media print{
body *{visibility:hidden}
#dynamicArea,#dynamicArea *,#chapterContent,#chapterContent *,#reportText{visibility:visible}
#dynamicArea,#chapterContent{position:absolute;left:0;top:0;width:100%}
.edit-only,.header-premium,.std-tab,.sub-pill,.theme-btn{display:none!important}
}

.plan-item{padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.plan-item.done{opacity:.6;text-decoration:line-through}
.flash-card{perspective:1000px;height:180px;cursor:pointer;margin-bottom:12px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:15px;line-height:1.5;border:1.5px solid var(--border)}
.flash-front{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.08))}
.flash-back{background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(16,185,129,.08));transform:rotateY(180deg)}
.diagram-card{padding:16px;border-radius:16px;border:1px solid var(--border);background:var(--surface);margin-bottom:12px;box-shadow:var(--card-shadow)}.diagram-card svg{display:block;margin:0 auto}
.diagram-emoji{font-size:48px;margin:8px 0}
.star-btn{background:none;border:none;cursor:pointer;font-size:18px;padding:2px 6px}
.star-btn.on{filter:none}
.goal-bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:8px 0}
.goal-fill{height:100%;background:linear-gradient(90deg,#22c55e,#06b6d4);transition:width .4s}
.font-ctrl{display:flex;gap:6px;align-items:center}
.font-ctrl button{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer}
.tip-box{padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(251,191,36,.05));border-left:4px solid #f59e0b;margin:10px 0;font-size:13px;line-height:1.55}
.oral-card{padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:center;margin-bottom:12px}
.weak-item{padding:10px 12px;border-radius:12px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);margin-bottom:8px;font-size:13px}
.export-box{padding:14px;border-radius:14px;background:var(--surface2);font-size:12px;word-break:break-all;max-height:120px;overflow:auto;margin:10px 0}


@keyframes fadeSlideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulseFire{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.anim-in{animation:fadeSlideIn .35s ease both}
.glass{background:rgba(255,255,255,.55)!important;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25)!important}
[data-theme="dark"] .glass{background:rgba(30,27,46,.65)!important;border:1px solid rgba(255,255,255,.08)!important}
.shimmer{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:14px;height:60px;margin:8px 0}
.progress-ring{width:88px;height:88px;position:relative;margin:0 auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dash-card{padding:14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);text-align:center}
.dash-card .num{font-size:22px;font-weight:800;line-height:1.2}
.dash-card .lbl{font-size:11px;color:var(--text2);margin-top:4px}
.streak-fire{font-size:28px;animation:pulseFire 1.5s ease infinite}
.step-bar{display:flex;gap:6px;margin:12px 0}
.step-pill{flex:1;padding:10px 6px;border-radius:12px;text-align:center;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer}
.step-pill.on{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;border-color:transparent}
.summary-item{padding:8px 12px;border-left:3px solid var(--primary);margin:6px 0;font-size:13px;background:var(--surface2);border-radius:0 10px 10px 0}
.diff-easy{background:#dcfce7;color:#166534;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700}
.diff-med{background:#fef9c3;color:#854d0e;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700}
.diff-hard{background:#fee2e2;color:#991b1b;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700}
[data-theme="dark"] .diff-easy{background:#14532d;color:#bbf7d0}
[data-theme="dark"] .diff-med{background:#713f12;color:#fef08a}
[data-theme="dark"] .diff-hard{background:#7f1d1d;color:#fecaca}
.mistake-item{padding:12px;border-radius:14px;border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.06);margin-bottom:8px}
.rev-chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;margin:2px;background:var(--surface2)}
.parent-banner{padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-size:13px;font-weight:600;margin-bottom:12px;text-align:center}
.sound-on{opacity:1}.sound-off{opacity:.45}


.grade-A{color:#059669;font-weight:800}.grade-B{color:#0284c7;font-weight:800}.grade-C{color:#d97706;font-weight:800}.grade-D{color:#ea580c;font-weight:800}.grade-F{color:#dc2626;font-weight:800}
.cert-box{padding:24px;border-radius:20px;border:3px solid #f59e0b;background:linear-gradient(135deg,#fffbeb,#fef3c7);text-align:center;color:#78350f;margin:12px 0}
[data-theme="dark"] .cert-box{background:linear-gradient(135deg,#422006,#78350f);color:#fef3c7;border-color:#fbbf24}
.tt-grid{display:grid;grid-template-columns:80px 1fr;gap:6px;font-size:13px;margin-top:8px}
.tt-day{font-weight:700;padding:8px;border-radius:10px;background:var(--surface2);text-align:center}
.tt-slot{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.note-card{padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px}
.paper-q{padding:10px 0;border-bottom:1px dashed var(--border);font-size:13px;line-height:1.5}


.more-menu-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px)}
.more-menu{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:78vh;overflow-y:auto;padding:18px 16px 28px;box-shadow:0 -8px 40px rgba(0,0,0,.15);animation:fadeSlideIn .3s ease}
.more-menu h3{font-size:16px;font-weight:800;margin-bottom:4px}
.more-cat{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.more-item{padding:12px 8px;border-radius:16px;border:1px solid var(--border);background:var(--surface2);text-align:center;cursor:pointer;font-size:11px;font-weight:600;line-height:1.35;transition:all .15s}
.more-item:active{transform:scale(.96);background:var(--primary);color:#fff;border-color:transparent}
.more-item .mi{font-size:22px;display:block;margin-bottom:4px}
.more-close{width:100%;margin-top:14px;padding:12px;border-radius:14px;border:none;background:var(--surface2);color:var(--text);font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
.main-pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sub-pill.more-btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none}
#subTabs{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}


.top-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0 8px}
.nav-menu-btn{padding:10px 16px;border-radius:14px;border:none;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.nav-menu-btn:active{transform:scale(.97)}
.drawer-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:90;display:flex;justify-content:flex-start;backdrop-filter:blur(5px)}
.drawer{width:min(320px,88vw);height:100%;background:var(--surface);overflow-y:auto;padding:18px 14px 40px;box-shadow:8px 0 40px rgba(0,0,0,.2);animation:drawerIn .28s ease}
@keyframes drawerIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-head h3{font-size:17px;font-weight:800}
.drawer-x{width:36px;height:36px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-size:18px;cursor:pointer;font-family:inherit;color:var(--text)}
.drawer-cat{font-size:11px;font-weight:700;color:var(--text2);margin:14px 0 6px;letter-spacing:.3px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer;font-size:13px;font-weight:600;border:1px solid transparent;margin-bottom:4px}
.drawer-item:active,.drawer-item.on{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));border-color:rgba(99,102,241,.3)}
.drawer-item .di{font-size:20px;width:28px;text-align:center}
.subj-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}


.hero-banner{padding:20px 18px;border-radius:22px;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 45%,#db2777 100%);color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.hero-banner::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-banner h2{font-size:20px;font-weight:800;margin:0 0 4px;position:relative;z-index:1}
.hero-banner p{font-size:13px;opacity:.9;margin:0;position:relative;z-index:1}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.quick-btn{padding:14px 6px;border-radius:16px;border:none;text-align:center;cursor:pointer;font-family:inherit;font-weight:700;font-size:11px;color:#fff;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.quick-btn span{display:block;font-size:22px;margin-bottom:4px}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.stat-card{padding:16px;border-radius:18px;color:#fff;position:relative;overflow:hidden}
.stat-card .sn{font-size:26px;font-weight:800}
.stat-card .sl{font-size:12px;opacity:.9;margin-top:2px}
.c1{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.c2{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.c3{background:linear-gradient(135deg,#10b981,#059669)}
.c4{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.welcome-chip{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.2);font-size:11px;font-weight:600;margin-bottom:8px}


#tipBox:empty{display:none!important}
#tipBox:not(:empty){display:block}

const data={"6-sci":{"title":"ધોરણ 6 કુતૂહલ (વિજ્ઞાન)","chapters":[{"name":"1. વિજ્ઞાનની અદ્ભુત દુનિયા","notes":"નિરીક્ષણ, પ્રશ્ન, અનુમાન, પ્રયોગ, નિષ્કર્ષ — વિજ્ઞાનનો સાર.","questions":[{"type":"MCQ","text":"વૈજ્ઞાનિક પદ્ધતિમાં પહેલું પગલું શું છે?\n(A) નિરીક્ષણ\n(B) અનુમાન\n(C) પ્રયોગ\n(D) નિષ્કર્ષ","answer":"(A) નિરીક્ષણ"},{"type":"MCQ","text":"વિજ્ઞાન મુખ્યત્વે શું કરે છે?\n(A) પ્રશ્નો પૂછે અને જવાબ શોધે\n(B) ફક્ત યાદ રાખે\n(C) ફક્ત વાંચે\n(D) ફક્ત લખે","answer":"(A) પ્રશ્નો પૂછે અને જવાબ શોધે"},{"type":"MCQ","text":"નિરીક્ષણ પછી શું કરવામાં આવે?\n(A) તરત નિષ્કર્ષ\n(B) પ્રશ્ન ઉભો કરવો\n(C) ભૂલી જવું\n(D) માપ ન લેવું","answer":"(B) પ્રશ્ન ઉભો કરવો"},{"type":"MCQ","text":"પ્રયોગનો હેતુ શું છે?\n(A) રમવું\n(B) યાદ રાખવું\n(C) અનુમાન તપાસવું\n(D) ચિત્ર દોરવું","answer":"(C) અનુમાન તપાસવું"},{"type":"MCQ","text":"વિજ્ઞાન કયા પર આધારિત છે?\n(A) પુરાવા અને નિરીક્ષણ\n(B) માત્ર અંધશ્રદ્ધા\n(C) માત્ર વાર્તા\n(D) માત્ર કલ્પના","answer":"(A) પુરાવા અને નિરીક્ષણ"},{"type":"MCQ","text":"સહપાઠી સાથે ચર્ચા કરવાથી શું થાય?\n(A) સમજ ઘટે\n(B) સમજ વધે\n(C) કંઈ નહીં\n(D) ભૂલ વધે","answer":"(B) સમજ વધે"},{"type":"MCQ","text":"વૈજ્ઞાનિક વલણમાં શું જરૂરી છે?\n(A) જિજ્ઞાસા\n(B) આળસ\n(C) ભય\n(D) અહંકાર","answer":"(A) જિજ્ઞાસા"},{"type":"MCQ","text":"પુસ્તકનું નામ ‘કુતૂહલ’ શા માટે?\n(A) ભય માટે\n(B) રમત માટે\n(C) જિજ્ઞાસા જગાડવા\n(D) મૂલ્યાંકન માટે","answer":"(C) જિજ્ઞાસા જગાડવા"},{"type":"MCQ","text":"નિષ્કર્ષ ક્યારે કાઢવો?\n(A) પહેલાં\n(B) પ્રયોગ/પુરાવા પછી\n(C) ક્યારેય નહીં\n(D) ફક્ત યાદથી","answer":"(B) પ્રયોગ/પુરાવા પછી"},{"type":"MCQ","text":"વિજ્ઞાન આસપાસની દુનિયા સાથે કેવી રીતે જોડાય છે?\n(A) નિરીક્ષણ અને પ્રશ્નોથી\n(B) ફક્ત પુસ્તકથી\n(C) ફક્ત ટીવીથી\n(D) જોડાતું નથી","answer":"(A) નિરીક્ષણ અને પ્રશ્નોથી"},{"type":"MCQ","text":"સુરક્ષા નિયમો ક્યારે પાલન કરવા?\n(A) પ્રયોગ દરમિયાન હંમેશા\n(B) ક્યારેક\n(C) ક્યારેય નહીં\n(D) ફક્ત ઘરે","answer":"(A) પ્રયોગ દરમિયાન હંમેશા"},{"type":"MCQ","text":"માપન શા માટે જરૂરી?\n(A) રમત માટે\n(B) ચોક્કસ માહિતી માટે\n(C) સમય કાઢવા\n(D) ચિત્ર માટે","answer":"(B) ચોક્કસ માહિતી માટે"},{"type":"MCQ","text":"સમૂહ કાર્યનો ફાયદો?\n(A) એકલતા\n(B) ઝઘડો\n(C) વિચાર વિનિમય\n(D) આળસ","answer":"(C) વિચાર વિનિમય"},{"type":"MCQ","text":"વિજ્ઞાનમાં ભૂલ થાય તો શું કરવું?\n(A) ફરી તપાસવું અને શીખવું\n(B) છોડી દેવું\n(C) છુપાવવું\n(D) ગુસ્સો કરવો","answer":"(A) ફરી તપાસવું અને શીખવું"},{"type":"MCQ","text":"પ્રશ્ન પૂછવું વિજ્ઞાનમાં શા માટે મહત્વનું?\n(A) સમય બગાડવા\n(B) નવું જ્ઞાન મેળવવા\n(C) ડરાવવા\n(D) રોકવા","answer":"(B) નવું જ્ઞાન મેળવવા"},{"type":"1 ગુણ","text":"વિજ્ઞાનનો સાર શું છે?","answer":"પ્રશ્નો પૂછવા, નિરીક્ષણ, શોધ અને તારણ"},{"type":"1 ગુણ","text":"નિરીક્ષણ એટલે શું?","answer":"ઇન્દ્રિયો વડે ધ્યાનથી જોવું/સાંભળવું/માપવું"},{"type":"1 ગુણ","text":"પ્રયોગ શા માટે કરાય?","answer":"અનુમાનની સત્યતા તપાસવા"},{"type":"1 ગુણ","text":"જિજ્ઞાસા એટલે શું?","answer":"જાણવાની ઈચ્છા / કુતૂહલ"},{"type":"1 ગુણ","text":"વૈજ્ઞાનિક પદ્ધતિના મુખ્ય પગલાં લખો.","answer":"નિરીક્ષણ → પ્રશ્ન → અનુમાન → પ્રયોગ → નિષ્કર્ષ"},{"type":"1 ગુણ","text":"સુરક્ષા નિયમનું એક ઉદાહરણ આપો.","answer":"પ્રયોગમાં ચશ્મા/મોજા પહેરવા, શિક્ષકની હાજરી"},{"type":"1 ગુણ","text":"સહપાઠી શિક્ષણનો અર્થ શું?","answer":"સાથે મળીને ચર્ચા કરીને શીખવું"},{"type":"1 ગુણ","text":"પુરાવા વગર નિષ્કર્ષ કેમ ન કાઢવો?","answer":"કારણ કે તે અવૈજ્ઞાનિક અને ભૂલભરેલો હોઈ શકે"},{"type":"1 ગુણ","text":"વિજ્ઞાન અને રોજિંદા જીવનનું એક જોડાણ લખો.","answer":"રસોઈમાં તાપમાન, ચુંબક, પાણીની અવસ્થા વગેરે"},{"type":"1 ગુણ","text":"‘કુતૂહલ’ પુસ્તકનો મુખ્ય હેતુ શું?","answer":"બાળકોમાં વિજ્ઞાન પ્રત્યે જિજ્ઞાસા અને અનુભવજન્ય શિક્ષણ"},{"type":"1 ગુણ","text":"નિરીક્ષણ અને અનુમાન વચ્ચે ફરક શું?","answer":"નિરીક્ષણ = જે જોવાય; અનુમાન = સમજૂતીનો અંદાજ"},{"type":"1 ગુણ","text":"પ્રયોગમાં નિયંત્રણ શા માટે જરૂરી?","answer":"સરખામણી અને સાચા તારણ માટે"},{"type":"1 ગુણ","text":"વિજ્ઞાનમાં નોંધ લેવી શા માટે જરૂરી?","answer":"પાછળથી તપાસ અને યાદ રાખવા"},{"type":"1 ગુણ","text":"સમૂહમાં કામ કરતી વખતે શું જરૂરી?","answer":"સહકાર, સાંભળવું, વિચાર વહેંચવો"},{"type":"1 ગુણ","text":"વિજ્ઞાન શીખવાનો આનંદ ક્યાંથી આવે?","answer":"શોધ, પ્રયોગ અને પ્રશ્નોના જવાબ મળવાથી"},{"type":"મહત્વના","text":"વૈજ્ઞાનિક પદ્ધતિ સમજાવો.","answer":"નિરીક્ષણથી પ્રશ્ન, અનુમાન, પ્રયોગ અને નિષ્કર્ષ — આ ક્રમે જ્ઞાન મેળવાય."},{"type":"મહત્વના","text":"જિજ્ઞાસા વિજ્ઞાનમાં કેમ મહત્વની?","answer":"કારણ કે પ્રશ્નો વગર શોધ અને નવું જ્ઞાન શરૂ જ ન થાય."},{"type":"મહત્વના","text":"પ્રયોગ અને નિરીક્ષણ વચ્ચે સંબંધ સમજાવો.","answer":"નિરીક્ષણથી પ્રશ્ન ઊભો થાય, પ્રયોગથી તેનો જવાબ મળે."},{"type":"વૈજ્ઞાનિક કારણ","text":"પ્રયોગ પહેલાં સુરક્ષા નિયમો કેમ જરૂરી?","answer":"દુર્ઘટના અટકાવવા અને સુરક્ષિત શિક્ષણ માટે."},{"type":"વૈજ્ઞાનિક કારણ","text":"નિષ્કર્ષ પુરાવા પર આધારિત કેમ હોવો જોઈએ?","answer":"કારણ કે વિજ્ઞાન તથ્ય અને પુરાવા પર ટકે છે, અંધશ્રદ્ધા પર નહીં."}]},{"name":"2. સજીવ સૃષ્ટિમાં વિવિધતા","notes":"સજીવોમાં આકાર, રહેઠાણ, આહાર, ગતિની વિવિધતા. વર્ગીકરણનો પાયો.","questions":[{"type":"MCQ","text":"સજીવોમાં વિવિધતા શા માટે જોવા મળે?\n(A) અલગ રહેઠાણ અને અનુકૂલન\n(B) ફક્ત રંગને કારણે\n(C) કંઈ નહીં\n(D) ફક્ત કદને કારણે","answer":"(A) અલગ રહેઠાણ અને અનુકૂલન"},{"type":"MCQ","text":"છોડ અને પ્રાણી વચ્ચે મુખ્ય ફરક?\n(A) બંને સરખા\n(B) છોડ ખોરાક બનાવે, પ્રાણી લે\n(C) પ્રાણી ખોરાક બનાવે\n(D) કોઈ ફરક નહીં","answer":"(B) છોડ ખોરાક બનાવે, પ્રાણી લે"},{"type":"MCQ","text":"જળીય સજીવો ક્યાં રહે?\n(A) જમીન પર\n(B) હવામાં\n(C) પાણીમાં\n(D) ફક્ત વૃક્ષ પર","answer":"(C) પાણીમાં"},{"type":"MCQ","text":"વર્ગીકરણનો ફાયદો શું?\n(A) અભ્યાસ સરળ બને\n(B) ગૂંચવણ વધે\n(C) કંઈ નહીં\n(D) નામ ભૂલાય","answer":"(A) અભ્યાસ સરળ બને"},{"type":"MCQ","text":"હર્બિવોર એટલે?\n(A) માંસાહારી\n(B) શાકાહારી\n(C) સર્વાહારી\n(D) જીવાણુ","answer":"(B) શાકાહારી"},{"type":"MCQ","text":"સજીવ સૃષ્ટિમાં વિવિધતા સંબંધિત મહત્વનું વિધાન કયું?\n(A) નિરીક્ષણ અને પ્રયોગથી સમજાય\n(B) ફક્ત યાદથી\n(C) કંઈ નહીં\n(D) ફક્ત કલ્પના","answer":"(A) નિરીક્ષણ અને પ્રયોગથી સમજાય"},{"type":"MCQ","text":"સજીવ સૃષ્ટિમાં વિવિધતા સંબંધિત મહત્વનું વિધાન કયું?\n(A) નિરીક્ષણ અને પ્રયોગથી સમજાય\n(B) ફક્ત યાદથી\n(C) કંઈ નહીં\n(D) ફક્ત કલ્પના","answer":"(A) નિરીક્ષણ અને પ્રયોગથી સમજાય"},{"type {t:"🌱 બીજ",f:"બીજમાં નવા છોડનું જીવન સુષુપ્ત અવસ્થામાં હોય છે. અંકુરણથી ઊગે."},
{t:"🐝 પરાગનયન",f:"મધમાખી, પતંગિયાં અને પવન પરાગનયનમાં મદદ કરે છે. ફળ-બીજ બને."},

scientists:[
{name:"આર્યભટ્ટ",icon:"🔭",era:"476–550 ઈ.",field:"ગણિત • ખગોળ",bio:"ભારતના મહાન ગણિતજ્ઞ અને ખગોળશાસ્ત્રી.\nશૂન્ય અને સ્થાનમાન અંકપદ્ધતિના વિકાસમાં યોગદાન.\nગ્રંથ ‘આર્યભટીય’માં ગણિત-ખગોળના સૂત્રો.\nપૃથ્વી પોતાની ધરી પર ફરે છે તે સ્પષ્ટ કહ્યું.\nપાઈ (π)નું મૂલ્ય લગભગ 3.1416 આપ્યું."},
{name:"સી.વી. રમણ",icon:"💡",era:"1888–1970",field:"ભૌતિક વિજ્ઞાન",bio:"ભારતના નોબેલ વિજેતા ભૌતિકશાસ્ત્રી.\nરમણ અસર (Raman Effect)ની શોધ — 1930 નોબેલ.\nપ્રકાશ પદાર્થમાંથી પસાર થાય ત્યારે તરંગલંબાઈ બદલાય.\nવિજ્ઞાન સંશોધનને ભારતમાં પ્રોત્સાહન આપ્યું.\nરમણ દિવસ 28 ફેબ્રુઆરીએ ઊજવાય છે."},
{name:"હોમી ભાભા",icon:"⚛️",era:"1909–1966",field:"પરમાણુ ઊર્જા",bio:"ભારતીય પરમાણુ કાર્યક્રમના પિતા.\nTIFR અને AEET (હવે BARC)ની સ્થાપના.\nશાંતિપૂર્ણ પરમાણુ ઊર્જાનો માર્ગ મોકલ્યો.\nકોસ્મિક કિરણો પર મહત્વનું સંશોધન.\nવિજ્ઞાન અને ટેક્નોલોજીની રાષ્ટ્રીય નીતિને આકાર આપ્યો."},
{name:"એ.પી.જે. અબ્દુલ કલામ",icon:"🚀",era:"1931–2015",field:"મિસાઇલ • અવકાશ",bio:"‘મિસાઇલ મેન ઓફ ઈન્ડિયા’ તરીકે જાણીતા.\nઅગ્નિ, પૃથ્વી મિસાઇલ અને પોખરણ-IIમાં યોગદાન.\nભારતના 11મા રાષ્ટ્રપતિ (2002–2007).\nવિદ્યાર્થીઓને પ્રેરણા આપતા ‘પીપલ્સ પ્રેસિડેન્ટ’.\nપુસ્તક ‘અગ્નિની પાંખો’ ખૂબ લોકપ્રિય."},
{name:"જગદીશચંદ્ર બોઝ",icon:"📡",era:"1858–1937",field:"ભૌતિક • વનસ્પતિ",bio:"રેડિયો તરંગો પર પ્રારંભિક સંશોધન કર્યું.\nછોડમાં સંવેદનશીલતા સાબિત કરી — ક્રેસ્કોગ્રાફ.\nવિજ્ઞાનને પેટન્ટ વગર ખુલ્લું રાખ્યું.\nબોઝ ઇન્સ્ટિટ્યૂટ, કોલકાતાના સ્થાપક.\nભૌતિક અને જીવવિજ્ઞાન બંનેમાં યોગદાન."},
{name:"શ્રીનિવાસ રામાનુજન",icon:"🔢",era:"1887–1920",field:"ગણિત",bio:"સ્વયંભૂ ગણિતીય પ્રતિભા — ઔપચારિક તાલીમ ઓછી.\nસંખ્યા સિદ્ધાંત, અનંત શ્રેણી, અવિભાજ્ય સંખ્યાઓ.\nકેમ્બ્રિજમાં જી.એચ. હાર્ડી સાથે કાર્ય.\nનોટબુકમાં હજુ પણ નવા સૂત્રો મળે છે.\nરામાનુજન નંબર 1729 પ્રસિદ્ધ છે."},
{name:"મેરી ક્યુરી",icon:"☢️",era:"1867–1934",field:"રસાયણ • ભૌતિક",bio:"પોલોનિયમ અને રેડિયમ તત્ત્વોની શોધ.\nરેડિયોકાર્યક્રમતા શબ્દ અને સંશોધન.\nબે વાર નોબેલ પારિતોષિક મેળવનાર પહેલી વ્યક્તિ.\nપ્રથમ મહિલા નોબેલ વિજેતા.\nવિજ્ઞાનમાં મહિલાઓ માટે પ્રેરણા."},
{name:"આલ્બર્ટ આઈન્સ્ટાઈન",icon:"🌟",era:"1879–1955",field:"ભૌતિક વિજ્ઞાન",bio:"સાપેક્ષતાનો વિશિષ્ટ અને સામાન્ય સિદ્ધાંત.\nE=mc² — ઊર્જા અને દળનો સંબંધ.\nફોટોઇલેક્ટ્રિક અસર માટે 1921 નોબેલ.\nઆધુનિક ભૌતિકી અને બ્રહ્માંડવિદ્યાનો પાયો.\nશાંતિ અને માનવતા માટે પણ અવાજ ઉઠાવ્યો."},
{name:"આઇઝેક ન્યૂટન",icon:"🍎",era:"1643–1727",field:"ભૌતિક • ગણિત",bio:"ગુરુત્વાકર્ષણનો સાર્વત્રિક નિયમ.\nગતિના ત્રણ નિયમો — યાંત્રિકીનો પાયો.\nકેલ્ક્યુલસનો સ્વતંત્ર વિકાસ.\nપ્રકાશ અને પ્રિઝમ — સફેદ પ્રકાશના રંગો.\n‘પ્રિન્સિપિયા’ મહાન ગ્રંથ."},
{name:"ગેલિલિયો ગેલિલી",icon:"🔭",era:"1564–1642",field:"ખગોળ • ભૌતિક",bio:"ટેલિસ્કોપથી આકાશનું વ્યવસ્થિત અવલોકન.\nગુરુના ઉપગ્રહો, ચંદ્રની સપાટી, શુક્રની કળાઓ.\nસૂર્યકેન્દ્રી મોડલને ટેકો — વિવાદ સહન કર્યો.\nલોલક અને મુક્ત પતન પર પ્રયોગ.\nઆધુનિક વૈજ્ઞાનિક પદ્ધતિના પિતા માનવામાં આવે."},
{name:"ચાર્લ્સ ડાર્વિન",icon:"🧬",era:"1809–1882",field:"જીવવિજ્ઞાન",bio:"પ્રાકૃતિક પસંદગી દ્વારા ઉત્ક્રાંતિનો સિદ્ધાંત.\n‘ઓન ધ ઓરિજિન ઑફ સ્પીસીઝ’ (1859).\nગેલાપાગોસ ટાપુઓની યાત્રાથી પ્રેરણા.\nજીવસૃષ્ટિની વિવિધતા સમજવાનો પાયો.\nઆધુનિક જીવવિજ્ઞાનનું મૂળ."},
{name:"લૂઈ પાશ્ચર",icon:"🧪",era:"1822–1895",field:"સૂક્ષ્મજીવવિજ્ઞાન",bio:"પાશ્ચરાઇઝેશન — દૂધ વગેરે રોગમુક્ત કરવા.\nરેબીઝ અને એન્થ્રેક્સની રસી.\nજીવાણુ સિદ્ધાંત — રોગોના કારણ સૂક્ષ્મજીવો.\nસ્વયંજનનના સિદ્ધાંતને ખોટો પાડ્યો.\nઆધુનિક રસીકરણ અને સ્વચ્છતાનો પાયો."},
{name:"થોમસ એડિસન",icon:"💡",era:"1847–1931",field:"આવિષ્કારક",bio:"વ્યવહારુ વીજળીના બલ્બને લોકપ્રિય બનાવ્યો.\nફોનોગ્રાફ (ધ્વનિ રેકોર્ડ)ની શોધ.\nમોશન પિક્ચર કેમેરામાં યોગદાન.\n1000થી વધુ પેટન્ટ — કાર્યશીલતાનું પ્રતીક.\n‘જિનિયસ એટલે 1% પ્રેરણા + 99% પરિશ્રમ’."},
{name:"એલેક્ઝાન્ડર ફ્લેમિંગ",icon:"💊",era:"1881–1955",field:"દવાશાસ્ત્ર",bio:"1928માં પેનિસિલિનની આકસ્મિક શોધ.\nપ્રથમ વ્યાપક એન્ટિબાયોટિક — અસંખ્ય જીવ બચાવ્યા.\nનોબેલ પારિતોષિક 1945 (સહવિજેતાઓ સાથે).\nસૂક્ષ્મજીવ વિરુદ્ધ દવાનો યુગ શરૂ.\nપ્રયોગશાળામાં અવલોકનની શક્તિનું ઉદાહરણ."},
{name:"વિક્રમ સારાભાઈ",icon:"🛰️",era:"1919–1971",field:"અવકાશ વિજ્ઞાન",bio:"ભારતીય અવકાશ કાર્યક્રમના પિતા.\nISROની સ્થાપના અને માર્ગદર્શન.\nઆર્યભટ્ટ ઉપગ્રહ માટે પાયો નાખ્યો.\nશિક્ષણ, ઉદ્યોગ અને વિજ્ઞાનને જોડ્યા.\n‘અવકાશ ટેક્નોલોજી સામાજિક વિકાસ માટે’ — દ્રષ્ટિ."},
{name:"સત્યેન્દ્રનાથ બોઝ",icon:"🔬",era:"1894–1974",field:"સૈદ્ધાંતિક ભૌતિકી",bio:"બોઝ-આઈન્સ્ટાઈન આંકડાશાસ્ત્રના સહસર્જક.\nબોસોન કણોનું નામ તેમના પરથી.\nક્વોન્ટમ યંત્રશાસ્ત્રમાં મહત્વનું યોગદાન.\nઆઈન્સ્ટાઈને તેમના પેપરની પ્રશંસા કરી.\nભારતીય સૈદ્ધાંતિક ભૌતિકીના મહારથી."},
{name:"મેઘનાદ સાહા",icon:"🌌",era:"1893–1956",field:"ખગોળ • ભૌતિક",bio:"સાહા આયનાઇઝેશન સમીકરણ — તારાઓનું સ્પેક્ટ્રમ.\nતારાઓના તાપમાન અને રચના સમજાઈ.\nભારતમાં વિજ્ઞાન શિક્ષણ અને સંશોધન સંસ્થાઓ.\nકલકત્તા વિશ્વવિદ્યાલયમાં પ્રાધ્યાપક.\nખગોળીય ભૌતિકીના આંતરરાષ્ટ્રીય નામ."},
{name:"એમ.એસ. સ્વામીનાથન",icon:"🌾",era:"1925–2023",field:"કૃષિ વિજ્ઞાન",bio:"ભારતની હરિત ક્રાંતિના પિતા.\nઊંચી ઉપજવાળા અનાજના જાતિઓ વિકસાવી.\nખાદ્ય અછતમાંથી સ્વાવલંબન તરફ દેશ.\nકૃષિ વિજ્ઞાન અને નીતિમાં આંતરરાષ્ટ્રીય સન્માન.\nકિસાન અને વિજ્ઞાનને જોડનાર સેતુ."},
{name:"નીલ્સ બોહ્ર",icon:"⚛️",era:"1885–1962",field:"પરમાણુ મોડલ",bio:"પરમાણુનું બોહ્ર મોડલ — ઇલેક્ટ્રોન કક્ષાઓ.\nક્વોન્ટમ સિદ્ધાંતના વિકાસમાં મુખ્ય ભૂમિકા.\nનોબેલ પારિતોષિક 1922.\nકોપનહેગનમાં સંશોધન કેન્દ્ર સ્થાપ્યું.\nપરમાણુ ઊર્જાના શાંતિપૂર્ણ ઉપયોગના હિમાયતી."},
{name:"રોઝાલિન્ડ ફ્રેન્કલિન",icon:"🧬",era:"1920–1958",field:"DNA રચના",bio:"X-ray Diffractionથી DNAની તસવીરો.\nડબલ હેલિક્સ સમજવામાં નિર્ણાયક યોગદાન.\nવૉટસન-ક્રિકના મોડલને આધાર મળ્યો.\nમહિલા વૈજ્ઞાનિક તરીકે પ્રેરણા.\nવિજ્ઞાનમાં યોગદાનની યોગ્ય માન્યતા પછીથી મળી."}
],
instruments:[
{name:"માઈક્રોસ્કોપ",icon:"🔬",use:"સૂક્ષ્મ વસ્તુઓને મોટી કરી જોવા.\nકોષ, સૂક્ષ્મજીવ, પેશીનું અવલોકન.\nલેન્સની મદદથી વિસ્તરણ.\nશાળા-પ્રયોગશાળામાં મૂળભૂત સાધન.\nજીવવિજ્ઞાનનું ‘આંખ’ કહેવાય."},
{name:"ટેલિસ્કોપ",icon:"🔭",use:"દૂરની વસ્તુઓ — તારા, ગ્રહ, ચંદ્ર.\nખગોળીય અવલોકન માટે.\nપ્રકાશ એકત્ર કરી મોટી છબી બનાવે.\nગેલિલિયોએ આકાશ સમજવા વાપર્યું.\nરિફ્રેક્ટર અને રિફ્લેક્ટર પ્રકાર."},
{name:"થર્મોમીટર",icon:"🌡️",use:"તાપમાન માપવાનું સાધન.\nપારો અથવા ડિજિટલ સેન્સર.\n°C અથવા °Fમાં વાંચન.\nશરીર, હવા, પ્રવાહીનું તાપમાન.\nપ્રયોગ અને આરોગ્ય બંનેમાં જરૂરી."},
{name:"હોકાયંત્ર",icon:"🧭",use:"દિશા નક્કી કરવા.\nચુંબકીય સોય ઉત્તર-દક્ષિણ બતાવે.\nપૃથ્વીના ચુંબકત્વ પર આધારિત.\nયાત્રા, નકશો, સ્કાઉટિંગમાં ઉપયોગી.\nચાર મુખ્ય દિશા — N S E W."},
{name:"બેરોમીટર",icon:"⏲️",use:"વાયુમંડળીય દબાણ માપવા.\nહવામાન આગાહીમાં મહત્વનું.\nપારાનું અથવા એનરોઇડ.\nદબાણ ઘટે તો વાવાઝોડાની શક્યતા.\nઊંચાઈ માપવામાં પણ મદદ."},
{name:"સ્પ્રિંગ બેલેન્સ",icon:"⚖️",use:"વજન (બળ) માપવા.\nસ્પ્રિંગના ખેંચાણથી વાંચે.\nન્યૂટન (N) અથવા ગ્રામમાં.\nપ્રયોગશાળા અને બજારમાં.\nહૂક પર વસ્તુ લટકાવી માપાય."},
{name:"મીટર સ્કેલ",icon:"📏",use:"લંબાઈ માપવાનું સાદું સાધન.\n1 m = 100 cm = 1000 mm.\nસીધી રેખીય માપ માટે.\nશાળાના દરેક પ્રયોગમાં.\nચોક્કસતા માટે આંખ સીધી રાખો."},
{name:"માપન સિલિન્ડર",icon:"🧪",use:"પ્રવાહીનું કદ (આયતન) માપવા.\nml અને Lમાં અંકિત.\nમેનિસ્કસની નીચેની સપાટી વાંચો.\nપ્રયોગમાં ચોક્કસ માત્રા.\nકાચ અથવા પ્લાસ્ટિકનું."},
{name:"બીકર",icon:"🧴",use:"પ્રવાહી રાખવા અને મિશ્રણ કરવા.\nમોટા મોંવાળું પાત્ર.\nગરમી આપી શકાય (કાચ).\nપ્રયોગશાળાનું મૂળભૂત પાત્ર.\nકદની અંદાજે અંકિત હોય."},
{name:"ટેસ્ટ ટ્યુબ",icon:"🧪",use:"નાના પ્રમાણમાં પ્રતિક્રિયા.\nગરમી આપીને પરીક્ષણ.\nટેસ્ટ ટ્યુબ હોલ્ડરથી પકડો.\nરસાયણ અને જીવવિજ્ઞાનમાં.\nસાફ અને સૂકી રાખવી જરૂરી."},
{name:"બન્સન બર્નર",icon:"🔥",use:"પ્રયોગશાળામાં ગરમી આપવા.\nગેસની નિયંત્રિત જ્યોત.\nવાયુ મિશ્રણથી નીલી જ્યોત.\nત્રિપાદ અને વાયર ગોઝ સાથે.\nસાવધાની — અગ્નિ સુરક્ષા."},
{name:"ત્રિપાદ સ્ટેન્ડ",icon:"🦵",use:"પાત્રને આગ ઉપર ટેકો આપવા.\nત્રણ પગ — સ્થિર આધાર.\nવાયર ગોઝ ઉપર મૂકાય.\nબીકર/ફ્લાસ્ક ગરમ કરતાં.\nલોખંડનું મજબૂત માળખું."},
{name:"ડ્રોપર",icon:"💧",use:"ટીપાં ટીપાં પ્રવાહી લેવા-મૂકવા.\nરબરના બલ્બથી ચૂસાય.\nચોક્કસ થોડી માત્રા.\nસૂચક, દવા, પ્રયોગમાં.\nદરેક રસાયણ માટે અલગ સાફ."},
{name:"ફનલ",icon:"🔽",use:"પ્રવાહી રેડવા અને ગાળણ.\nછિદ્રવાળા કાગળ સાથે ગાળણ.\nસાંકડી ગરદનવાળી બોટલમાં.\nકાચ અથવા પ્લાસ્ટિક.\nઘન-પ્રવાહી અલગ કરવા."},
{name:"મેગ્નિફાઈંગ ગ્લાસ",icon:"🔍",use:"વસ્તુને મોટી કરી જોવા.\nએક ઉત્તલ લેન્સ.\nનાના અક્ષર, કીટ, છોડ.\nસાદું અને સસ્તું સાધન.\nકેન્દ્રમાંથી જોવાથી સ્પષ્ટ."},
{name:"એમીટર",icon:"🔌",use:"વિદ્યુત પ્રવાહ માપવા (એમ્પિયર).\nસર્કિટમાં શ્રેણીમાં જોડાય.\nધન-ઋણ ધ્રુવ ધ્યાને રાખો.\nવિદ્યુત પ્રયોગનું મુખ્ય મીટર.\nઅતિ પ્રવાહથી બચાવો."},
{name:"વોલ્ટમીટર",icon:"🔋",use:"વિદ્યુત વોલ્ટેજ (વિભવાંતર) માપવા.\nસમાંતરમાં જોડાય.\nસેલ અથવા બે બિંદુ વચ્ચે.\nવોલ્ટમાં વાંચન.\nએમીટરથી અલગ જોડાણ."},
{name:"બેટરી / સેલ",icon:"🔋",use:"વિદ્યુત ઊર્જાનો સ્ત્રોત.\nરાસાયણિક ઊર્જા → વિદ્યુત.\nધન (+) અને ઋણ (−) ધ્રુવ.\nસર્કિટમાં પ્રવાહ ચલાવે.\nસૂકા સેલ અને ચાર્જેબલ."},
{name:"સ્વિચ",icon:"🔘",use:"પરિપથ ચાલુ અથવા બંધ કરવા.\nસર્કિટનું નિયંત્રણ.\nસુરક્ષા અને સગવડ.\nઘર અને પ્રયોગશાળા બંનેમાં.\nખુલ્લું = બંધ, બંધ = ચાલુ."},
{name:"લેન્સ",icon:"👓",use:"પ્રકાશને કેન્દ્રિત અથવા વિખેરવા.\nઉત્તલ (મોટું) / અવતલ (નાનું).\nચશ્મા, માઈક્રોસ્કોપ, કેમેરા.\nકેન્દ્રબિંદુ અને ફોકસ લંબાઈ.\nપ્રકાશના નિયમો શીખવા."},
{name:"પ્રિઝમ",icon:"🔺",use:"સફેદ પ્રકાશને સાત રંગમાં વિભાજિત.\nમેઘધનુષ સમજાવે.\nત્રિકોણીય કાચનું ખંડ.\nવિચલન અને વિભાજન.\nન્યૂટનના પ્રયોગનું સાધન."},
{name:"અરીસો",icon:"🪞",use:"પ્રકાશનું પરાવર્તન.\nસમતલ — સમાન આભાસી પ્રતિબિંબ.\nગોળાકાર — મોટું/નાનું પ્રતિબિંબ.\nપેરિસ્કોપ, હેડલાઈટમાં.\nઆંખે જોઈને કાયદા ચકાસો."},
{name:"સ્ટેથોસ્કોપ",icon:"🩺",use:"હૃદય અને ફેફસાંના અવાજ સાંભળવા.\nડોક્ટરનું મુખ્ય નિદાન સાધન.\nધ્વનિને કાન સુધી પહોંચાડે.\nધબકાર અને શ્વાસ તપાસ.\nઆરોગ્ય વિજ્ઞાનમાં અનિવાર્ય."},
{name:"સેકન્ડ ઘડિયાળ",icon:"⏱️",use:"પ્રયોગમાં ચોક્કસ સમય માપવા.\nસેકન્ડ અને મિનિટ.\nગતિ, લોલક, પ્રતિક્રિયા સમય.\nસ્ટાર્ટ-સ્ટોપ સુવિધા.\nભૌતિકી પ્રયોગનું સાથી."},
{name:"પેટ્રી ડીશ",icon:"🧫",use:"સૂક્ષ્મજીવ અથવા કોષ કલ્ચર.\nસપાટ ગોળ ઢાંકણવાળું પાત્ર.\nજીવવિજ્ઞાન પ્રયોગો.\nઅગર માધ્યમ પર ઉગાડવા.\nસ્ટેરાઇલ (જંતુમુક્ત) રાખો."},
{name:"ત્રાજવું / બેલેન્સ",icon:"⚖️",use:"દળ (માસ) માપવા.\nમાનક વજન સાથે સરખામણી.\nબંને તરફ સમાન થાય ત્યારે વાંચો.\nરસાયણ અને ભૌતિકીમાં.\nચોક્કસતા માટે સમતલ સપાટી."},
{name:"વેર્નિયર કેલિપર્સ",icon:"📐",use:"આંતરિક, બાહ્ય અને ઊંડાઈ માપ.\n0.1 mm સુધી ચોક્કસ.\nમુખ્ય સ્કેલ + વેર્નિયર સ્કેલ.\nનળી, ગોળી, સળિયાનું માપ.\nભૌતિકી પ્રયોગમાં અગત્યનું."},
{name:"સ્ક્રૂ ગેજ",icon:"🔧",use:"ખૂબ પાતળી જાડાઈ માપવા.\n0.01 mm સુધી ચોક્કસ.\nતાર, કાગળ, પ્લેટ.\nસ્ક્રૂની પિચ પર આધારિત.\nમાઈક્રોમીટર પણ કહેવાય."},
{name:"મેગ્નેટ",icon:"🧲",use:"લોખંડ / સ્ટીલ આકર્ષવા.\nઉત્તર-દક્ષિણ ધ્રુવ.\nહોકાયંત્ર, મોટર, ડાયનેમો.\nસમાન ધ્રુવ દૂર, વિષમ નજીક.\nકુદરતી અને કૃત્રિમ."},
{name:"ઇલેક્ટ્રોમેગ્નેટ",icon:"⚡",use:"વિદ્યુતથી ચુંબકત્વ ઉત્પન્ન.\nપ્રવાહ બંધ થતાં ચુંબકત્વ જાય.\nક્રેન, ઘંટ, રિલેમાં.\nકોઇલ + લોખંડનું અંતઃકેન્દ્ર.\nઔદ્યોગિક અને ઘરેલું ઉપયોગ."},
{name:"સોલાર પેનલ",icon:"☀️",use:"સૂર્યપ્રકાશને વિદ્યુતમાં ફેરવવા.\nપુનઃપ્રાપ્ય ઊર્જા સ્ત્રોત.\nફોટોવોલ્ટેઇક કોષો.\nઘર, કેલ્ક્યુલેટર, ઉપગ્રહ.\nપર્યાવરણ મૈત્રીપૂર્ણ."},
{name:"એનિમોમીટર",icon:"🌬️",use:"પવનની ઝડપ માપવા.\nહવામાન સ્ટેશનમાં.\nકપ અથવા પ્રોપેલર પ્રકાર.\nkm/h અથવા m/sમાં.\nવાવાઝોડા અને ઉડ્ડયનમાં."},
{name:"રેઈન ગેજ",icon:"🌧️",use:"વરસાદની માત્રા માપવા.\nmmમાં વાંચન.\nનળાકાર પાત્ર + માપન સ્કેલ.\nહવામાન વિભાગનું સાધન.\nકૃષિ અને પૂર આગાહી."},
{name:"ગ્લોબ",icon:"🌍",use:"પૃથ્વીનું ત્રિ-પરિમાણીય મોડલ.\nખંડ, મહાસાગર, દેશ.\nધરી 23½° નમેલી — ઋતુઓ.\nભૂગોળ શિક્ષણનું ઉત્તમ સાધન.\nરોટેશન અને રિવોલ્યુશન સમજાવે."},
{name:"નકશો",icon:"🗺️",use:"સપાટ કાગળ પર પૃથ્વી/પ્રદેશ.\nસ્કેલ, દિશા, સંકેત.\nરસ્તા, નદી, પહાડ દર્શાવે.\nયાત્રા અને અભ્યાસમાં.\nરાજનીતિક અને ભૌગોલિક પ્રકાર."},
{name:"કેલ્ક્યુલેટર",icon:"🔢",use:"ઝડપી અને ચોક્કસ ગણતરી.\nસરવાળો, ગુણાકાર, વર્ગમૂળ.\nવૈજ્ઞાનિક મોડલમાં સાઇન-કોસ.\nશાળા અને દુકાન બંનેમાં.\nબેટરી અથવા સોલાર."},
{name:"કમ્પ્યુટર",icon:"💻",use:"માહિતી સંગ્રહ અને પ્રક્રિયા.\nશિક્ષણ, સંશોધન, મનોરંજન.\nબાઈનરી ભાષા — 0 અને 1.\nહાર્ડવેર + સોફ્ટવેર.\nઆધુનિક યુગનું મુખ્ય સાધન."},
{name:"પ્રોજેક્ટર",icon:"📽️",use:"છબી/સ્લાઇડ મોટી કરી દીવાલ પર.\nવર્ગ અને મીટિંગમાં.\nLCD / LED ટેક્નોલોજી.\nશિક્ષણને દૃશ્યમાન બનાવે.\nઅંધારું વાતાવરણ સારું."},
{name:"સ્પીકર",icon:"🔊",use:"વિદ્યુત સંકેતને અવાજમાં ફેરવવા.\nસંગીત, ઘોષણા, પ્રયોગ.\nમેગ્નેટ અને કોઇલની મદદ.\nઘરથી સ્ટેડિયમ સુધી.\nવોલ્યુમ નિયંત્રણ સાથે."},
{name:"માઈક્રોફોન",icon:"🎤",use:"અવાજને વિદ્યુત સંકેતમાં ફેરવવા.\nરેકોર્ડિંગ અને સ્પીકર સિસ્ટમ.\nડાયાફ્રેમની કંપન.\nગાયન, ભાષણ, વિજ્ઞાન પ્રયોગ.\nસ્પીકરનો ઊલટો કાર્ય."},
{name:"કેમેરા",icon:"📷",use:"પ્રકાશથી છબી પકડવા.\nલેન્સ + સેન્સર / ફિલ્મ.\nવિજ્ઞાનમાં અવલોકન નોંધ.\nમોબાઇલથી DSLR સુધી.\nસમય અને સ્થળ કાયમી."},
{name:"GPS",icon:"📍",use:"ઉપગ્રહથી સ્થાન નક્કી કરવા.\nઅક્ષાંશ-રેખાંશ આપે.\nનેવિગેશન, નકશો, બચાવ કાર્ય.\nમોબાઇલ અને વાહનમાં.\nવૈશ્વિક પોઝિશનિંગ સિસ્ટમ."},
{name:"કેલરીએમીટર",icon:"🥣",use:"ઉષ્મા માત્રા માપવા.\nઉષ્માસંબંધી પ્રયોગો.\nઇન્સ્યુલેટેડ પાત્ર.\nદળ × ઉષ્માધારિતા × ΔT.\nભૌતિકી પ્રયોગશાળા."},
{name:"ગેલ્વેનોમીટર",icon:"📉",use:"ખૂબ નાનો વિદ્યુત પ્રવાહ શોધવા.\nસંવેદનશીલ મીટર.\nએમીટર-વોલ્ટમીટરનો આધાર.\nદિશા અને માત્રા બતાવે.\nવિદ્યુત પ્રયોગમાં."},
{name:"રેઝિસ્ટર",icon:"📶",use:"પ્રવાહને નિયંત્રિત પ્રતિરોધ.\nઓહ્મ (Ω)માં માપ.\nસર્કિટમાં વોલ્ટેજ વહેંચણી.\nફિક્સ્ડ અને વેરિએબલ.\nઓહ્મના નિયમનો આધાર."},
{name:"સ્લાઇડ (માઈક્રો)",icon:"🧫",use:"નમૂનો માઈક્રોસ્કોપ હેઠળ રાખવા.\nપાતળો કાચનો ટુકડો.\nકવર સ્લિપથી ઢાંકાય.\nકોષ, પરાગ, પાણીના જીવ.\nસ્વચ્છ અને પાતળો નમૂનો."},
{name:"પિપેટ",icon:"💧",use:"ચોક્કસ કદનું પ્રવાહી માપી લેવા.\nmlમાં અંકિત.\nરસાયણ વિશ્લેષણમાં.\nમોંથી ન ચૂસો — પિપેટ ફિલર.\nચોક્કસતા માટે મેનિસ્કસ."},
{name:"ઇલેક્ટ્રોમીટર",icon:"⚡",use:"સ્થિર વિદ્યુત આવેશ માપવા-શોધવા.\nસોનાના પાંદડાનું અથવા ડિજિટલ.\nઆવેશની હાજરી બતાવે.\nસ્થિર વિદ્યુત પ્રયોગો.\nશાળામાં સાદું પાંદડા વાળું."},
{name:"સ્ફિગ્મોમેનોમીટર",icon:"💉",use:"બ્લડ પ્રેશર (રક્તદબાણ) માપવા.\nmmHgમાં સિસ્ટોલિક/ડાયસ્ટોલિક.\nકફ + મેનોમીટર + સ્ટેથોસ્કોપ.\nઆરોગ્ય તપાસનું મુખ્ય સાધન.\nસામાન્ય ≈ 120/80 mmHg."},
{name:"વાયર ગોઝ",icon:"🔲",use:"બીકરને સમાન ગરમી આપવા.\nત્રિપાદ પર મૂકાય.\nલોખંડની જાળી + એસ્બેસ્ટોસ કેન્દ્ર.\nસીધી જ્યોતથી કાચ ન તૂટે.\nપ્રયોગશાળા સુરક્ષા સાધન."}

function loadAll(){try{var s=localStorage.getItem(STORE);if(!s)return;var p=JSON.parse(s);if(!p||typeof p!=="object")return;
Object.keys(p).forEach(function(k){try{
  if(!data[k]){data[k]=p[k];return;}
  var loc=p[k], base=data[k];
  if(!loc||!loc.chapters)return;
  if(!base.chapters){data[k]=loc;return;}
  var merged={title:loc.title||base.title,chapters:[]};
  var maxLen=Math.max(base.chapters.length,loc.chapters.length);
  for(var i=0;i<maxLen;i++){
    var bc=base.chapters[i], lc=loc.chapters[i];
    if(!lc){merged.chapters.push(bc);continue;}
    if(!bc){merged.chapters.push(lc);continue;}
    var bq=(bc.questions||[]).length, lq=(lc.questions||[]).length;
    if(lq>=bq && lq>0) merged.chapters.push(lc);
    else merged.chapters.push({name:lc.name||bc.name,notes:(lc.notes!=null?lc.notes:bc.notes),questions:(bq?bc.questions:(lc.questions||[]))});
  }
  data[k]=merged;
}catch(err){console.warn("merge",k,err);}});
}catch(e){console.warn("loadAll",e);}

function generatePaper(marks){
  var pool=[];
  Object.keys(data).forEach(function(k){
    if(k.indexOf(currentStd+"-")!==0)return;
    (data[k].chapters||[]).forEach(function(ch){
      (ch.questions||[]).forEach(function(q){pool.push({t:q.text,a:q.answer,ch:ch.name,type:q.type});});
    });
  });
  if(pool.length<5){alert("પૂરતા પ્રશ્નો નથી");return;}
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;}
  var qs=pool.slice(0,marks);
  var html='<div class="card anim-in" style="padding:16px" id="paperPrint">';
  html+='<div style="text-align:center;margin-bottom:12px"><b style="font-size:16px">GSEB TOPPER — પ્રશ્નપત્ર</b><br/><span style="font-size:12px;color:var(--text2)">ધોરણ '+currentStd+' | કુલ '+marks+' માર્ક્સ | સમય: '+(marks===10?30:marks===20?45:60)+' મિનિટ</span></div>';
  qs.forEach(function(q,i){
    html+='<div class="paper-q"><b>'+(i+1)+'.</b> ['+ (q.type||"") +'] '+q.t+' <span style="color:var(--text2);font-size:11px">(1 માર્ક)</span></div>';
  });
  html+='</div>';
  html+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
  html+='<button class="btn btn-primary btn-sm" id="btnShowAns">🔑 જવાબ કી</button>';
  html+='<button class="btn btn-teal btn-sm" onclick="window.print()">🖨️ પ્રિન્ટ</button>';
  html+='</div><div id="paperAns" class="hidden" style="margin-top:12px"></div>';
  document.getElementById("paperOut").innerHTML=html;
  document.getElementById("btnShowAns").onclick=function(){
    var a='<div class="card" style="padding:12px"><b>જવાબ કી</b>';
    qs.forEach(function(q,i){a+='<div style="font-size:12px;margin:4px 0">'+(i+1)+'. '+(q.a||"—")+'</div>';});
    a+='</div>';
    var el=document.getElementById("paperAns");el.innerHTML=a;el.classList.remove("hidden");
  };
}

function difficultyOf(q,qi){
  if(!q) return "easy";
  var t=(q.type||"").toLowerCase();
  if(t.indexOf("hots")>=0||t.indexOf("વૈજ્ઞાનિક")>=0) return "hard";
  if(t.indexOf("mcq")>=0||t.indexOf("1 ગુણ")>=0) return qi%5===0?"medium":"easy";
  if(t.indexOf("મહત્વ")>=0) return "medium";
  return "easy";
}
function diffBadge(level){
  var m={easy:'<span class="badge" style="background:#d1fae5;color:#065f46;font-size:10px">સહેલું</span>',
    medium:'<span class="badge" style="background:#fef3c7;color:#92400e;font-size:10px">મધ્યમ</span>',
    hard:'<span class="badge" style="background:#ffe4e6;color:#9f1239;font-size:10px">કઠિન</span>'};
  return m[level]||m.easy;
}

/* Approximate Hindu tithi from local date (Swiss-style elongation approx) */
function toJulian(y,m,d){
  if(m<=2){y--;m+=12;}
  var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function norm360(x){x=x%360;if(x<0)x+=360;return x;}
function calcTithi(date){
  var y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  var jd=toJulian(y,m,d)+0.5; // local noon-ish
  var T=(jd-2451545.0)/36525;
  // Sun mean longitude (deg)
  var Ls=norm360(280.46646+36000.76983*T+0.0003032*T*T);
  // Moon mean longitude
  var Lm=norm360(218.3165+481267.8813*T);
  // Moon mean anomaly, sun anomaly - rough elongation
  var D=norm360(297.8502+445267.1115*T-0.0016300*T*T); // mean elongation
  // Use true-ish elongation approximation
  var elong=norm360(D+6.289*Math.sin((Lm-Ls)*Math.PI/180)); // simple correction
  // Better: elong ≈ Lm - Ls with corrections
  var Ma=norm360(134.9634+477198.8676*T);
  var Sa=norm360(357.5291+35999.0503*T);
  elong=norm360(Lm-Ls
    +6.289*Math.sin(Ma*Math.PI/180)
    -1.274*Math.sin((2*D-Ma)*Math.PI/180)
    +0.658*Math.sin(2*D*Math.PI/180)
    -0.186*Math.sin(Sa*Math.PI/180)
  );
  var tithiNum=Math.floor(elong/12)+1; // 1..30
  if(tithiNum>30)tithiNum=30;
  if(tithiNum<1)tithiNum=1;
  var paksha, name, idx;
  if(tithiNum<=15){
    paksha=PAKSHA_SHUKLA;
    idx=tithiNum;
    name=(idx===15)?TITHI_NAMES[15]:TITHI_NAMES[idx];
  }else{
    paksha=PAKSHA_KRISHNA;
    idx=tithiNum-15;
    name=(idx===15)?TITHI_KRISHNA_15:TITHI_NAMES[idx];
  }
  // Hindu month approx from sun longitude
  var sunLon=norm360(Ls+1.915*Math.sin(Sa*Math.PI/180));
  var mIdx=Math.floor(sunLon/30); // 0..11 roughly Mesha=0 at 0° but offset
  // Sidereal approx: subtract ayanamsa ~24°
  var sid=norm360(sunLon-24);
  mIdx=Math.floor(sid/30)%12;
  var month=HINDU_MONTHS[mIdx];
  // વિક્રમ સંવત: ચૈત્રથી નવું વર્ષ (~માર્ચ/એપ્રિલ)
  var gy=y, gmd=m*100+d;
  var vs=(gmd>=321)?(gy+57):(gy+56); // 21 માર્ચ પછી +57
  // જો હિંદુ માસ ચૈત્ર/વૈશાખ... હોય તો +57 વધુ સાચું
  if(mIdx<=9) vs=gy+57; // ચૈત્ર(0)..પોષ — મોટા ભાગે +57
  if(mIdx>=10 && gmd<321) vs=gy+56; // મહા/ફાગણ વર્ષની શરૂઆત પહેલાં
  return{paksha:paksha,name:name,month:month,num:tithiNum,idx:idx,vs:vs,mIdx:mIdx};
}
function guDateStr(){
  var d=new Date();
  return DAY_NAMES[d.getDay()]+", "+toGuNum(d.getDate())+" "+MONTH_GU[d.getMonth()]+" "+toGuNum(d.getFullYear());
}
function guTithiStr(){
  return guTithiFull();
}
function guTithiFull(){
  var t=calcTithi(new Date());
  var d=new Date();
  var pakshaFull=(t.paksha==="શુક્લ")?"શુક્લ પક્ષ":"કૃષ્ણ પક્ષ";
  // ઉદા: વિ.સં. ૨૦૮૨, અષાઢ માસ, કૃષ્ણ પક્ષ, પંચમી · સોમવાર
  return "વિ.સં. "+toGuNum(t.vs)+", "+t.month+" માસ, "+pakshaFull+", "+t.name+" · "+DAY_NAMES[d.getDay()];
}
function toGuNum(n){
  var map={"0":"૦","1":"૧","2":"૨","3":"૩","4":"૪","5":"૫","6":"૬","7":"૭","8":"૮","9":"૯"};
  return String(n).split("").map(function(c){return map[c]||c;}).join("");
}

  try{

    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=ok?880:220;g.gain.value=0.08;

function addFormula(){if(!isUnlocked)return;var sub=(subjects[currentStd]||[])[0];if(!sub)return;var k=currentStd+"-"+sub.id;var t=prompt("સૂત્રનું નામ:");if(!t)return;var f=prompt("સૂત્ર:");if(!f)return;if(!FORMULAS[k])FORMULAS[k]=[];FORMULAS[k].push({t:t,f:f});saveFormulas();renderFormulas();}
function editFormula(k,i){if(!isUnlocked)return;var t=prompt("નામ:",FORMULAS[k][i].t);if(t===null)return;var f=prompt("સૂત્ર:",FORMULAS[k][i].f);if(f===null)return;FORMULAS[k][i]={t:t,f:f};saveFormulas();renderFormulas();}

function startQuickQuiz(){var pool=[];Object.keys(data).forEach(function(k){if(k.indexOf(currentStd+"-")!==0)return;(data[k].chapters||[]).forEach(function(ch){(ch.questions||[]).forEach(function(q){pool.push(q);});});});
if(pool.length<3){alert("પૂરતા પ્રશ્નો નથી");return;}for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
var qs=pool.slice(0,5).map(function(q){return{type:q.type,text:q.text,answer:q.answer,options:q.type==="MCQ"?shuffle([q.answer||"સાચો","A","B","C"]):null};});
quickQuiz={qs:qs,i:0,score:0,feedback:null};renderQuickQuiz();}
function answerQuick(ans){if(!quickQuiz||quickQuiz.feedback)return;var q=quickQuiz.qs[quickQuiz.i];var a=String(ans||"").trim().toLowerCase(),c=String(q.answer||"").trim().toLowerCase();var ok=a&&(a===c||c.indexOf(a)>=0);
if(ok){quickQuiz.score++;fireMini();playSound(true);}else{playSound(false);try{addMistake(q.text,q.answer,""); }catch(e){}}quickQuiz.feedback={ok:ok,msg:ok?"✅ સાચું!":"❌ સાચો જવાબ: "+q.answer};renderQuickQuiz();
setTimeout(function(){quickQuiz.feedback=null;quickQuiz.i++;if(quickQuiz.i>=5){checkBadges();var sc=quickQuiz.score;quickQuiz=null;try{var g=ensureGoalDay();g.qd+=5;saveGoal(g);}catch(e){}document.getElementById("dynamicArea").innerHTML='<div style="text-align:center;padding:30px"><div style="font-size:48px">'+(sc>=4?"🎉":"👍")+'</div><h3 style="font-size:28px;font-weight:800;margin:12px 0">'+sc+'/5</h3><button onclick="startQuickQuiz()" class="btn btn-primary">ફરી</button> <button onclick="switchSub("quiz")" class="btn" style="background:var(--surface2);color:var(--text)">બંધ</button></div>';}else renderQuickQuiz();},900);}

function startVS(){var p1=(document.getElementById("p1name").value||"A").trim(),p2=(document.getElementById("p2name").value||"B").trim();
var pool=[];Object.keys(data).forEach(function(k){if(k.indexOf(currentStd+"-")!==0)return;(data[k].chapters||[]).forEach(function(ch){(ch.questions||[]).forEach(function(q){pool.push(q);});});});
if(pool.length<5){alert("પ્રશ્નો ઓછા");return;}for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}

vsState={p1:p1,p2:p2,s1:0,s2:0,qs:qs,i:0,turn:0,done:false};renderVS();}

function paintDiagList(){

  if(f==="math"&&sub.indexOf("ગણિત")<0)return;

});

}

function renderWeak(){
document.getElementById("dashBox").innerHTML="";
var scores=getScores(),weak=[];
Object.keys(data).forEach(function(k){if(k.indexOf(currentStd+"-")!==0)return;(data[k].chapters||[]).forEach(function(ch,ci){
  var sc=scores[k+"-"+ci];
  if(sc!==undefined&&sc<15)weak.push({name:ch.name,sc:sc,key:k,ci:ci});
  if(sc===undefined)weak.push({name:ch.name,sc:null,key:k,ci:ci});
});});
weak.sort(function(a,b){if(a.sc===null)return 1;if(b.sc===null)return -1;return a.sc-b.sc;});
var html='<h2 style="font-size:20px;font-weight:800;color:#dc2626;margin-bottom:6px">⚠️ નબળા પ્રકરણ</h2><p style="font-size:13px;color:var(--text2);margin-bottom:12px">15થી ઓછા સ્કોર / ન થયેલા ટેસ્ટ</p>';
if(!weak.length)html+='<p style="color:var(--success)">🎉 બધા પ્રકરણ સારા!</p>';
weak.slice(0,15).forEach(function(w){
  html+='<div class="weak-item"><b>'+w.name+'</b> — '+(w.sc===null?'ટેસ્ટ બાકી':w.sc+'/25')+'</div>';
});
document.getElementById("dynamicArea").innerHTML=html;
}

function renderChapterTip(){
  if(viewKey===null)return "";
  var tip=TEACHER_TIPS[viewKey]||"";
  var html='<div class="step-bar anim-in">';
  html+='<div class="step-pill'+(studyStep==="read"?" on":"")+'" data-step="read">📖 વાંચો</div>';
  html+='<div class="step-pill'+(studyStep==="practice"?" on":"")+'" data-step="practice">✏️ પ્રેક્ટિસ</div>';
  html+='<div class="step-pill'+(studyStep==="test"?" on":"")+'" data-step="test">📝 ટેસ્ટ</div>';
  html+='</div>';
  html+='<div class="tip-box"><b>👨‍🏫 શિક્ષક ટિપ:</b> <span id="tipText"></span>';
  html+='<div class="edit-only" style="margin-top:8px"><button class="btn btn-amber btn-sm" id="btnEditTip">✏️ ટિપ</button></div></div>';
  var pts=CHAPTER_SUMMARY[viewKey]||defaultSummary("");
  if(studyStep==="read"){
    html+='<div class="card anim-in" style="padding:12px;margin:10px 0" id="sumBox"><b style="font-size:13px">📝 મુખ્ય મુદ્દા</b>';
    pts.forEach(function(p){html+='<div class="summary-item">• '+p+'</div>';});
    html+='<button class="edit-only btn btn-amber btn-sm" style="margin-top:6px" id="btnEditSum">✏️</button></div>';
  }
  setTimeout(function(){
    document.querySelectorAll("[data-step]").forEach(function(el){
      el.onclick=function(){setStudyStep(el.getAttribute("data-step"));};
    });
    var tt=document.getElementById("tipText");if(tt)tt.textContent=tip||"Edit Modeમાં ટિપ ઉમેરો";
    var bt=document.getElementById("btnEditTip");if(bt)bt.onclick=editChapterTip;
    var bs=document.getElementById("btnEditSum");if(bs)bs.onclick=function(){editSummary(viewKey);};
  },30);

function editChapterTip(){
  if(!isUnlocked||viewKey===null)return;
  var t=prompt("શિક્ષક ટિપ:",TEACHER_TIPS[viewKey]||"");
  if(t===null)return;
  TEACHER_TIPS[viewKey]=t;saveTips();renderChapterPage();
}
function bindChapterStars(){
  if(viewKey===null)return;
  var ch=(function(){var p=viewKey.split("-"),std=p[0],sid=p[1],ci=parseInt(p[2],10);var d=data[std+"-"+sid];return d&&d.chapters?d.chapters[ci]:null;})();
  if(!ch)return;
  document.querySelectorAll(".star-btn[data-qi]").forEach(function(btn){
    var qi=parseInt(btn.getAttribute("data-qi"),10);
    var q=(ch.questions||[])[qi];
    if(!q)return;
    btn.onclick=function(ev){
      ev.stopPropagation();
      var id=viewKey+"-"+qi;
      toggleStar(id,q.text,q.answer||"",ch.name||"");
      btn.textContent=STARRED[id]?"⭐":"☆";
      btn.classList.toggle("on",!!STARRED[id]);
    };
  });
}
function toggleStar(id,text,ans,ch){
  if(STARRED[id])delete STARRED[id];else STARRED[id]={text:text,ans:ans,ch:ch};
  saveStars();
}

document.getElementById("dashBox").innerHTML="";
var html='<h2 style="font-size:20px;font-weight:800;color:#475569;margin-bottom:6px">💾 ડેટા બેકઅપ</h2><p style="font-size:13px;color:var(--text2);margin-bottom:12px">Export / Import — ફોન બદલાય તો પણ ડેટા સુરક્ષિત</p>';

function doExport(){
  var payload={v:1,data:data,subjects:subjects,EXTRA:EXTRA,FORMULAS:FORMULAS,GLOSSARY:GLOSSARY,FLASHCARDS:FLASHCARDS,DIAGRAMS:DIAGRAMS,TEACHER_TIPS:TEACHER_TIPS,STARRED:STARRED,STUDY_PLAN:STUDY_PLAN,EXAM_PATTERN:EXAM_PATTERN,MISTAKES:MISTAKES,CHAPTER_SUMMARY:CHAPTER_SUMMARY,REVISION:REVISION,STUDENT_NOTES:STUDENT_NOTES,TIMETABLE:TIMETABLE,scores:getScores()};
  var t=JSON.stringify(payload);
  document.getElementById("exportBox").textContent=t.slice(0,500)+(t.length>500?"...("+t.length+" chars)":"");
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){alert("કૉપી થયું! સુરક્ષિત જગ્યાએ સાચવો.");}).catch(function(){prompt("કૉપી કરો:",t);});
  else prompt("કૉપી કરો:",t);
}
function doImport(){
  var t=document.getElementById("importArea").value.trim();
  if(!t){alert("JSON પેસ્ટ કરો");return;}
  try{
    var p=JSON.parse(t);
    if(p.data)data=p.data;
    if(p.subjects)subjects=p.subjects;
    if(p.EXTRA)EXTRA=p.EXTRA;
    if(p.FORMULAS)FORMULAS=p.FORMULAS;
    if(p.GLOSSARY)GLOSSARY=p.GLOSSARY;
    if(p.FLASHCARDS)FLASHCARDS=p.FLASHCARDS;
    if(p.DIAGRAMS)DIAGRAMS=p.DIAGRAMS;
    if(p.TEACHER_TIPS)TEACHER_TIPS=p.TEACHER_TIPS;
    if(p.STARRED)STARRED=p.STARRED;
    if(p.STUDY_PLAN)STUDY_PLAN=p.STUDY_PLAN;
    if(p.EXAM_PATTERN)EXAM_PATTERN=p.EXAM_PATTERN;if(p.MISTAKES)MISTAKES=p.MISTAKES;if(p.CHAPTER_SUMMARY)CHAPTER_SUMMARY=p.CHAPTER_SUMMARY;if(p.REVISION)REVISION=p.REVISION;if(p.STUDENT_NOTES)STUDENT_NOTES=p.STUDENT_NOTES;if(p.TIMETABLE)TIMETABLE=p.TIMETABLE;
    if(p.scores)try{localStorage.setItem(SCORES_KEY,JSON.stringify(p.scores));}catch(e){}
    saveAll();saveExtra();saveFormulas();saveGlossary();saveFlash();saveDiag();saveTips();saveStars();savePlan();savePattern();
    alert("Import સફળ!");renderSubTabs();render();
  }catch(e){alert("ખોટી JSON: "+e.message);}
}

/* Font size */
function applyFontSize(){
  var s=parseInt(localStorage.getItem(FONT_KEY)||"16",10);
  document.documentElement.style.setProperty("--base-font",s+"px");
  document.body.style.fontSize=s+"px";
}
function changeFont(d){
  var s=parseInt(localStorage.getItem(FONT_KEY)||"16",10)+d;
  s=Math.max(12,Math.min(22,s));
  localStorage.setItem(FONT_KEY,String(s));
  applyFontSize();
}
/* Auto night */
function checkAutoNight(){
  var h=new Date().getHours();
  if(h>=20||h<6){
    if(!document.documentElement.classList.contains("dark")){
      document.documentElement.classList.add("dark");
    }
  }
}
