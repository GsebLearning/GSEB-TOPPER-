[data-theme="dark"]{--bg:linear-gradient(165deg,#0c0a14,#1a1025,#0c1222);--surface:#1e1b2e;--surface2:#16132a;--text:#f1f5f9;--text2:#94a3b8;--border:#2e2a45;--primary:#818cf8;--primary2:#a78bfa;--accent:#f472b6;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--header:linear-gradient(135deg,#312e81,#4c1d95,#9d174d);--card-shadow:0 4px 24px rgba(0,0,0,.45);--glass:rgba(30,27,46,.88);--input-bg:#16132a}

body{font-family:'Noto Sans Gujarati',system-ui,sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
.hidden{display:none!important}.locked .edit-only{display:none!important}
.btn{padding:8px 16px;border-radius:12px;font-weight:600;font-size:13px;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn:active{transform:scale(.96)}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn-ghost{background:rgba(255,255,255,.18);color:#fff}.btn-amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-teal{background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff}.btn-sm{padding:5px 10px;font-size:11px;border-radius:8px}
.card{background:var(--surface);border-radius:20px;border:1px solid var(--border);box-shadow:var(--card-shadow)}
.chap-card{cursor:pointer;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px;transition:all .2s}
.chap-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:8px}

.std-tab{flex:1;padding:14px 8px;text-align:center;font-weight:700;border:none;cursor:pointer;font-size:14px;font-family:inherit;color:rgba(255,255,255,.45);background:transparent}
.std-tab.active{color:#fff;background:rgba(255,255,255,.14);border-radius:12px 12px 0 0}
.sub-pill{padding:9px 14px;border-radius:999px;font-weight:600;font-size:12px;border:none;cursor:pointer;font-family:inherit}
.sub-pill.active{color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}.sub-pill:not(.active){background:var(--surface2);color:var(--text2)}
.test-option{border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:8px;cursor:pointer;background:var(--surface);font-size:14px}
.test-option.selected{background:rgba(99,102,241,.14);border-color:var(--primary);font-weight:600}
.test-option.correct{background:rgba(16,185,129,.15)!important;border-color:var(--success)!important}
.test-option.wrong{background:rgba(239,68,68,.12)!important;border-color:var(--danger)!important}

.modal-box{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:400px;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;font-family:inherit;font-size:14px;background:var(--input-bg);color:var(--text);margin-bottom:10px;outline:none}

.mat-card{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px}
.mat-card h4{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:8px}
.mat-card ul{padding-left:18px;font-size:13px;line-height:1.7;color:var(--text2)}
.score-pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(16,185,129,.15);color:var(--success)}
.filter-chip{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit}

.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.dash-card{padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--border);text-align:center}
.dash-card .num{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dash-card .lbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:600}
.progress-bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s}

.badge-earned{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:12px;font-weight:600;margin:4px}
.badge-earned.on{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(251,191,36,.1));border-color:rgba(245,158,11,.4)}
.formula-card{padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.05));border:1px solid rgba(99,102,241,.2);margin-bottom:10px}
.formula-card h4{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:6px}
.timer-bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:10px 0}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--success),var(--warning),var(--danger));transition:width .3s}
.quiz-q{font-size:16px;font-weight:600;line-height:1.5;margin:12px 0}
.daily-card{padding:14px;border-radius:18px;margin-bottom:12px;border:1px solid var(--border);background:var(--surface)}
.report-box{padding:16px;border-radius:16px;background:var(--surface2);font-size:13px;line-height:1.7;white-space:pre-wrap}
.glossary-item{padding:12px;border-bottom:1px solid var(--border)}
.glossary-item b{color:var(--primary)}
.vs-score{font-size:28px;font-weight:800;text-align:center}


@media print{
body *{visibility:hidden}
#dynamicArea,#dynamicArea *,#chapterContent,#chapterContent *,#reportText{visibility:visible}
#dynamicArea,#chapterContent{position:absolute;left:0;top:0;width:100%}
.edit-only,.header-premium,.std-tab,.sub-pill,.theme-btn{display:none!important}

</style>

scientists:[
{name:"આર્યભટ્ટ",icon:"🔭",era:"476–550 ઈ.",field:"ગણિત • ખગોળ",bio:"ભારતના મહાન ગણિતજ્ઞ અને ખગોળશાસ્ત્રી.\nશૂન્ય અને સ્થાનમાન અંકપદ્ધતિના વિકાસમાં યોગદાન.\nગ્રંથ ‘આર્યભટીય’માં ગણિત-ખગોળના સૂત્રો.\nપૃથ્વી પોતાની ધરી પર ફરે છે તે સ્પષ્ટ કહ્યું.\nપાઈ (π)નું મૂલ્ય લગભગ 3.1416 આપ્યું."},
{name:"સી.વી. રમણ",icon:"💡",era:"1888–1970",field:"ભૌતિક વિજ્ઞાન",bio:"ભારતના નોબેલ વિજેતા ભૌતિકશાસ્ત્રી.\nરમણ અસર (Raman Effect)ની શોધ — 1930 નોબેલ.\nપ્રકાશ પદાર્થમાંથી પસાર થાય ત્યારે તરંગલંબાઈ બદલાય.\nવિજ્ઞાન સંશોધનને ભારતમાં પ્રોત્સાહન આપ્યું.\nરમણ દિવસ 28 ફેબ્રુઆરીએ ઊજવાય છે."},
{name:"હોમી ભાભા",icon:"⚛️",era:"1909–1966",field:"પરમાણુ ઊર્જા",bio:"ભારતીય પરમાણુ કાર્યક્રમના પિતા.\nTIFR અને AEET (હવે BARC)ની સ્થાપના.\nશાંતિપૂર્ણ પરમાણુ ઊર્જાનો માર્ગ મોકલ્યો.\nકોસ્મિક કિરણો પર મહત્વનું સંશોધન.\nવિજ્ઞાન અને ટેક્નોલોજીની રાષ્ટ્રીય નીતિને આકાર આપ્યો."},
{name:"એ.પી.જે. અબ્દુલ કલામ",icon:"🚀",era:"1931–2015",field:"મિસાઇલ • અવકાશ",bio:"‘મિસાઇલ મેન ઓફ ઈન્ડિયા’ તરીકે જાણીતા.\nઅગ્નિ, પૃથ્વી મિસાઇલ અને પોખરણ-IIમાં યોગદાન.\nભારતના 11મા રાષ્ટ્રપતિ (2002–2007).\nવિદ્યાર્થીઓને પ્રેરણા આપતા ‘પીપલ્સ પ્રેસિડેન્ટ’.\nપુસ્તક ‘અગ્નિની પાંખો’ ખૂબ લોકપ્રિય."},
{name:"જગદીશચંદ્ર બોઝ",icon:"📡",era:"1858–1937",field:"ભૌતિક • વનસ્પતિ",bio:"રેડિયો તરંગો પર પ્રારંભિક સંશોધન કર્યું.\nછોડમાં સંવેદનશીલતા સાબિત કરી — ક્રેસ્કોગ્રાફ.\nવિજ્ઞાનને પેટન્ટ વગર ખુલ્લું રાખ્યું.\nબોઝ ઇન્સ્ટિટ્યૂટ, કોલકાતાના સ્થાપક.\nભૌતિક અને જીવવિજ્ઞાન બંનેમાં યોગદાન."},
{name:"શ્રીનિવાસ રામાનુજન",icon:"🔢",era:"1887–1920",field:"ગણિત",bio:"સ્વયંભૂ ગણિતીય પ્રતિભા — ઔપચારિક તાલીમ ઓછી.\nસંખ્યા સિદ્ધાંત, અનંત શ્રેણી, અવિભાજ્ય સંખ્યાઓ.\nકેમ્બ્રિજમાં જી.એચ. હાર્ડી સાથે કાર્ય.\nનોટબુકમાં હજુ પણ નવા સૂત્રો મળે છે.\nરામાનુજન નંબર 1729 પ્રસિદ્ધ છે."},
{name:"મેરી ક્યુરી",icon:"☢️",era:"1867–1934",field:"રસાયણ • ભૌતિક",bio:"પોલોનિયમ અને રેડિયમ તત્ત્વોની શોધ.\nરેડિયોકાર્યક્રમતા શબ્દ અને સંશોધન.\nબે વાર નોબેલ પારિતોષિક મેળવનાર પહેલી વ્યક્તિ.\nપ્રથમ મહિલા નોબેલ વિજેતા.\nવિજ્ઞાનમાં મહિલાઓ માટે પ્રેરણા."},
{name:"આલ્બર્ટ આઈન્સ્ટાઈન",icon:"🌟",era:"1879–1955",field:"ભૌતિક વિજ્ઞાન",bio:"સાપેક્ષતાનો વિશિષ્ટ અને સામાન્ય સિદ્ધાંત.\nE=mc² — ઊર્જા અને દળનો સંબંધ.\nફોટોઇલેક્ટ્રિક અસર માટે 1921 નોબેલ.\nઆધુનિક ભૌતિકી અને બ્રહ્માંડવિદ્યાનો પાયો.\nશાંતિ અને માનવતા માટે પણ અવાજ ઉઠાવ્યો."},
{name:"આઇઝેક ન્યૂટન",icon:"🍎",era:"1643–1727",field:"ભૌતિક • ગણિત",bio:"ગુરુત્વાકર્ષણનો સાર્વત્રિક નિયમ.\nગતિના ત્રણ નિયમો — યાંત્રિકીનો પાયો.\nકેલ્ક્યુલસનો સ્વતંત્ર વિકાસ.\nપ્રકાશ અને પ્રિઝમ — સફેદ પ્રકાશના રંગો.\n‘પ્રિન્સિપિયા’ મહાન ગ્રંથ."},
{name:"ગેલિલિયો ગેલિલી",icon:"🔭",era:"1564–1642",field:"ખગોળ • ભૌતિક",bio:"ટેલિસ્કોપથી આકાશનું વ્યવસ્થિત અવલોકન.\nગુરુના ઉપગ્રહો, ચંદ્રની સપાટી, શુક્રની કળાઓ.\nસૂર્યકેન્દ્રી મોડલને ટેકો — વિવાદ સહન કર્યો.\nલોલક અને મુક્ત પતન પર પ્રયોગ.\nઆધુનિક વૈજ્ઞાનિક પદ્ધતિના પિતા માનવામાં આવે."},
{name:"ચાર્લ્સ ડાર્વિન",icon:"🧬",era:"1809–1882",field:"જીવવિજ્ઞાન",bio:"પ્રાકૃતિક પસંદગી દ્વારા ઉત્ક્રાંતિનો સિદ્ધાંત.\n‘ઓન ધ ઓરિજિન ઑફ સ્પીસીઝ’ (1859).\nગેલાપાગોસ ટાપુઓની યાત્રાથી પ્રેરણા.\nજીવસૃષ્ટિની વિવિધતા સમજવાનો પાયો.\nઆધુનિક જીવવિજ્ઞાનનું મૂળ."},
{name:"લૂઈ પાશ્ચર",icon:"🧪",era:"1822–1895",field:"સૂક્ષ્મજીવવિજ્ઞાન",bio:"પાશ્ચરાઇઝેશન — દૂધ વગેરે રોગમુક્ત કરવા.\nરેબીઝ અને એન્થ્રેક્સની રસી.\nજીવાણુ સિદ્ધાંત — રોગોના કારણ સૂક્ષ્મજીવો.\nસ્વયંજનનના સિદ્ધાંતને ખોટો પાડ્યો.\nઆધુનિક રસીકરણ અને સ્વચ્છતાનો પાયો."},
{name:"થોમસ એડિસન",icon:"💡",era:"1847–1931",field:"આવિષ્કારક",bio:"વ્યવહારુ વીજળીના બલ્બને લોકપ્રિય બનાવ્યો.\nફોનોગ્રાફ (ધ્વનિ રેકોર્ડ)ની શોધ.\nમોશન પિક્ચર કેમેરામાં યોગદાન.\n1000થી વધુ પેટન્ટ — કાર્યશીલતાનું પ્રતીક.\n‘જિનિયસ એટલે 1% પ્રેરણા + 99% પરિશ્રમ’."},
{name:"એલેક્ઝાન્ડર ફ્લેમિંગ",icon:"💊",era:"1881–1955",field:"દવાશાસ્ત્ર",bio:"1928માં પેનિસિલિનની આકસ્મિક શોધ.\nપ્રથમ વ્યાપક એન્ટિબાયોટિક — અસંખ્ય જીવ બચાવ્યા.\nનોબેલ પારિતોષિક 1945 (સહવિજેતાઓ સાથે).\nસૂક્ષ્મજીવ વિરુદ્ધ દવાનો યુગ શરૂ.\nપ્રયોગશાળામાં અવલોકનની શક્તિનું ઉદાહરણ."},
{name:"વિક્રમ સારાભાઈ",icon:"🛰️",era:"1919–1971",field:"અવકાશ વિજ્ઞાન",bio:"ભારતીય અવકાશ કાર્યક્રમના પિતા.\nISROની સ્થાપના અને માર્ગદર્શન.\nઆર્યભટ્ટ ઉપગ્રહ માટે પાયો નાખ્યો.\nશિક્ષણ, ઉદ્યોગ અને વિજ્ઞાનને જોડ્યા.\n‘અવકાશ ટેક્નોલોજી સામાજિક વિકાસ માટે’ — દ્રષ્ટિ."},
{name:"સત્યેન્દ્રનાથ બોઝ",icon:"🔬",era:"1894–1974",field:"સૈદ્ધાંતિક ભૌતિકી",bio:"બોઝ-આઈન્સ્ટાઈન આંકડાશાસ્ત્રના સહસર્જક.\nબોસોન કણોનું નામ તેમના પરથી.\nક્વોન્ટમ યંત્રશાસ્ત્રમાં મહત્વનું યોગદાન.\nઆઈન્સ્ટાઈને તેમના પેપરની પ્રશંસા કરી.\nભારતીય સૈદ્ધાંતિક ભૌતિકીના મહારથી."},
{name:"મેઘનાદ સાહા",icon:"🌌",era:"1893–1956",field:"ખગોળ • ભૌતિક",bio:"સાહા આયનાઇઝેશન સમીકરણ — તારાઓનું સ્પેક્ટ્રમ.\nતારાઓના તાપમાન અને રચના સમજાઈ.\nભારતમાં વિજ્ઞાન શિક્ષણ અને સંશોધન સંસ્થાઓ.\nકલકત્તા વિશ્વવિદ્યાલયમાં પ્રાધ્યાપક.\nખગોળીય ભૌતિકીના આંતરરાષ્ટ્રીય નામ."},
{name:"એમ.એસ. સ્વામીનાથન",icon:"🌾",era:"1925–2023",field:"કૃષિ વિજ્ઞાન",bio:"ભારતની હરિત ક્રાંતિના પિતા.\nઊંચી ઉપજવાળા અનાજના જાતિઓ વિકસાવી.\nખાદ્ય અછતમાંથી સ્વાવલંબન તરફ દેશ.\nકૃષિ વિજ્ઞાન અને નીતિમાં આંતરરાષ્ટ્રીય સન્માન.\nકિસાન અને વિજ્ઞાનને જોડનાર સેતુ."},
{name:"નીલ્સ બોહ્ર",icon:"⚛️",era:"1885–1962",field:"પરમાણુ મોડલ",bio:"પરમાણુનું બોહ્ર મોડલ — ઇલેક્ટ્રોન કક્ષાઓ.\nક્વોન્ટમ સિદ્ધાંતના વિકાસમાં મુખ્ય ભૂમિકા.\nનોબેલ પારિતોષિક 1922.\nકોપનહેગનમાં સંશોધન કેન્દ્ર સ્થાપ્યું.\nપરમાણુ ઊર્જાના શાંતિપૂર્ણ ઉપયોગના હિમાયતી."},
{name:"રોઝાલિન્ડ ફ્રેન્કલિન",icon:"🧬",era:"1920–1958",field:"DNA રચના",bio:"X-ray Diffractionથી DNAની તસવીરો.\nડબલ હેલિક્સ સમજવામાં નિર્ણાયક યોગદાન.\nવૉટસન-ક્રિકના મોડલને આધાર મળ્યો.\nમહિલા વૈજ્ઞાનિક તરીકે પ્રેરણા.\nવિજ્ઞાનમાં યોગદાનની યોગ્ય માન્યતા પછીથી મળી."}
],
instruments:[
{name:"માઈક્રોસ્કોપ",icon:"🔬",use:"સૂક્ષ્મ વસ્તુઓને મોટી કરી જોવા.\nકોષ, સૂક્ષ્મજીવ, પેશીનું અવલોકન.\nલેન્સની મદદથી વિસ્તરણ.\nશાળા-પ્રયોગશાળામાં મૂળભૂત સાધન.\nજીવવિજ્ઞાનનું ‘આંખ’ કહેવાય."},
{name:"ટેલિસ્કોપ",icon:"🔭",use:"દૂરની વસ્તુઓ — તારા, ગ્રહ, ચંદ્ર.\nખગોળીય અવલોકન માટે.\nપ્રકાશ એકત્ર કરી મોટી છબી બનાવે.\nગેલિલિયોએ આકાશ સમજવા વાપર્યું.\nરિફ્રેક્ટર અને રિફ્લેક્ટર પ્રકાર."},
{name:"થર્મોમીટર",icon:"🌡️",use:"તાપમાન માપવાનું સાધન.\nપારો અથવા ડિજિટલ સેન્સર.\n°C અથવા °Fમાં વાંચન.\nશરીર, હવા, પ્રવાહીનું તાપમાન.\nપ્રયોગ અને આરોગ્ય બંનેમાં જરૂરી."},
{name:"હોકાયંત્ર",icon:"🧭",use:"દિશા નક્કી કરવા.\nચુંબકીય સોય ઉત્તર-દક્ષિણ બતાવે.\nપૃથ્વીના ચુંબકત્વ પર આધારિત.\nયાત્રા, નકશો, સ્કાઉટિંગમાં ઉપયોગી.\nચાર મુખ્ય દિશા — N S E W."},
{name:"બેરોમીટર",icon:"⏲️",use:"વાયુમંડળીય દબાણ માપવા.\nહવામાન આગાહીમાં મહત્વનું.\nપારાનું અથવા એનરોઇડ.\nદબાણ ઘટે તો વાવાઝોડાની શક્યતા.\nઊંચાઈ માપવામાં પણ મદદ."},
{name:"સ્પ્રિંગ બેલેન્સ",icon:"⚖️",use:"વજન (બળ) માપવા.\nસ્પ્રિંગના ખેંચાણથી વાંચે.\nન્યૂટન (N) અથવા ગ્રામમાં.\nપ્રયોગશાળા અને બજારમાં.\nહૂક પર વસ્તુ લટકાવી માપાય."},
{name:"મીટર સ્કેલ",icon:"📏",use:"લંબાઈ માપવાનું સાદું સાધન.\n1 m = 100 cm = 1000 mm.\nસીધી રેખીય માપ માટે.\nશાળાના દરેક પ્રયોગમાં.\nચોક્કસતા માટે આંખ સીધી રાખો."},
{name:"માપન સિલિન્ડર",icon:"🧪",use:"પ્રવાહીનું કદ (આયતન) માપવા.\nml અને Lમાં અંકિત.\nમેનિસ્કસની નીચેની સપાટી વાંચો.\nપ્રયોગમાં ચોક્કસ માત્રા.\nકાચ અથવા પ્લાસ્ટિકનું."},
{name:"બીકર",icon:"🧴",use:"પ્રવાહી રાખવા અને મિશ્રણ કરવા.\nમોટા મોંવાળું પાત્ર.\nગરમી આપી શકાય (કાચ).\nપ્રયોગશાળાનું મૂળભૂત પાત્ર.\nકદની અંદાજે અંકિત હોય."},
{name:"ટેસ્ટ ટ્યુબ",icon:"🧪",use:"નાના પ્રમાણમાં પ્રતિક્રિયા.\nગરમી આપીને પરીક્ષણ.\nટેસ્ટ ટ્યુબ હોલ્ડરથી પકડો.\nરસાયણ અને જીવવિજ્ઞાનમાં.\nસાફ અને સૂકી રાખવી જરૂરી."},
{name:"બન્સન બર્નર",icon:"🔥",use:"પ્રયોગશાળામાં ગરમી આપવા.\nગેસની નિયંત્રિત જ્યોત.\nવાયુ મિશ્રણથી નીલી જ્યોત.\nત્રિપાદ અને વાયર ગોઝ સાથે.\nસાવધાની — અગ્નિ સુરક્ષા."},
{name:"ત્રિપાદ સ્ટેન્ડ",icon:"🦵",use:"પાત્રને આગ ઉપર ટેકો આપવા.\nત્રણ પગ — સ્થિર આધાર.\nવાયર ગોઝ ઉપર મૂકાય.\nબીકર/ફ્લાસ્ક ગરમ કરતાં.\nલોખંડનું મજબૂત માળખું."},
{name:"ડ્રોપર",icon:"💧",use:"ટીપાં ટીપાં પ્રવાહી લેવા-મૂકવા.\nરબરના બલ્બથી ચૂસાય.\nચોક્કસ થોડી માત્રા.\nસૂચક, દવા, પ્રયોગમાં.\nદરેક રસાયણ માટે અલગ સાફ."},
{name:"ફનલ",icon:"🔽",use:"પ્રવાહી રેડવા અને ગાળણ.\nછિદ્રવાળા કાગળ સાથે ગાળણ.\nસાંકડી ગરદનવાળી બોટલમાં.\nકાચ અથવા પ્લાસ્ટિક.\nઘન-પ્રવાહી અલગ કરવા."},
{name:"મેગ્નિફાઈંગ ગ્લાસ",icon:"🔍",use:"વસ્તુને મોટી કરી જોવા.\nએક ઉત્તલ લેન્સ.\nનાના અક્ષર, કીટ, છોડ.\nસાદું અને સસ્તું સાધન.\nકેન્દ્રમાંથી જોવાથી સ્પષ્ટ."},
{name:"એમીટર",icon:"🔌",use:"વિદ્યુત પ્રવાહ માપવા (એમ્પિયર).\nસર્કિટમાં શ્રેણીમાં જોડાય.\nધન-ઋણ ધ્રુવ ધ્યાને રાખો.\nવિદ્યુત પ્રયોગનું મુખ્ય મીટર.\nઅતિ પ્રવાહથી બચાવો."},
{name:"વોલ્ટમીટર",icon:"🔋",use:"વિદ્યુત વોલ્ટેજ (વિભવાંતર) માપવા.\nસમાંતરમાં જોડાય.\nસેલ અથવા બે બિંદુ વચ્ચે.\nવોલ્ટમાં વાંચન.\nએમીટરથી અલગ જોડાણ."},
{name:"બેટરી / સેલ",icon:"🔋",use:"વિદ્યુત ઊર્જાનો સ્ત્રોત.\nરાસાયણિક ઊર્જા → વિદ્યુત.\nધન (+) અને ઋણ (−) ધ્રુવ.\nસર્કિટમાં પ્રવાહ ચલાવે.\nસૂકા સેલ અને ચાર્જેબલ."},
{name:"સ્વિચ",icon:"🔘",use:"પરિપથ ચાલુ અથવા બંધ કરવા.\nસર્કિટનું નિયંત્રણ.\nસુરક્ષા અને સગવડ.\nઘર અને પ્રયોગશાળા બંનેમાં.\nખુલ્લું = બંધ, બંધ = ચાલુ."},
{name:"લેન્સ",icon:"👓",use:"પ્રકાશને કેન્દ્રિત અથવા વિખેરવા.\nઉત્તલ (મોટું) / અવતલ (નાનું).\nચશ્મા, માઈક્રોસ્કોપ, કેમેરા.\nકેન્દ્રબિંદુ અને ફોકસ લંબાઈ.\nપ્રકાશના નિયમો શીખવા."},
{name:"પ્રિઝમ",icon:"🔺",use:"સફેદ પ્રકાશને સાત રંગમાં વિભાજિત.\nમેઘધનુષ સમજાવે.\nત્રિકોણીય કાચનું ખંડ.\nવિચલન અને વિભાજન.\nન્યૂટનના પ્રયોગનું સાધન."},
{name:"અરીસો",icon:"🪞",use:"પ્રકાશનું પરાવર્તન.\nસમતલ — સમાન આભાસી પ્રતિબિંબ.\nગોળાકાર — મોટું/નાનું પ્રતિબિંબ.\nપેરિસ્કોપ, હેડલાઈટમાં.\nઆંખે જોઈને કાયદા ચકાસો."},
{name:"સ્ટેથોસ્કોપ",icon:"🩺",use:"હૃદય અને ફેફસાંના અવાજ સાંભળવા.\nડોક્ટરનું મુખ્ય નિદાન સાધન.\nધ્વનિને કાન સુધી પહોંચાડે.\nધબકાર અને શ્વાસ તપાસ.\nઆરોગ્ય વિજ્ઞાનમાં અનિવાર્ય."},
{name:"સેકન્ડ ઘડિયાળ",icon:"⏱️",use:"પ્રયોગમાં ચોક્કસ સમય માપવા.\nસેકન્ડ અને મિનિટ.\nગતિ, લોલક, પ્રતિક્રિયા સમય.\nસ્ટાર્ટ-સ્ટોપ સુવિધા.\nભૌતિકી પ્રયોગનું સાથી."},
{name:"પેટ્રી ડીશ",icon:"🧫",use:"સૂક્ષ્મજીવ અથવા કોષ કલ્ચર.\nસપાટ ગોળ ઢાંકણવાળું પાત્ર.\nજીવવિજ્ઞાન પ્રયોગો.\nઅગર માધ્યમ પર ઉગાડવા.\nસ્ટેરાઇલ (જંતુમુક્ત) રાખો."},
{name:"ત્રાજવું / બેલેન્સ",icon:"⚖️",use:"દળ (માસ) માપવા.\nમાનક વજન સાથે સરખામણી.\nબંને તરફ સમાન થાય ત્યારે વાંચો.\nરસાયણ અને ભૌતિકીમાં.\nચોક્કસતા માટે સમતલ સપાટી."},
{name:"વેર્નિયર કેલિપર્સ",icon:"📐",use:"આંતરિક, બાહ્ય અને ઊંડાઈ માપ.\n0.1 mm સુધી ચોક્કસ.\nમુખ્ય સ્કેલ + વેર્નિયર સ્કેલ.\nનળી, ગોળી, સળિયાનું માપ.\nભૌતિકી પ્રયોગમાં અગત્યનું."},
{name:"સ્ક્રૂ ગેજ",icon:"🔧",use:"ખૂબ પાતળી જાડાઈ માપવા.\n0.01 mm સુધી ચોક્કસ.\nતાર, કાગળ, પ્લેટ.\nસ્ક્રૂની પિચ પર આધારિત.\nમાઈક્રોમીટર પણ કહેવાય."},
{name:"મેગ્નેટ",icon:"🧲",use:"લોખંડ / સ્ટીલ આકર્ષવા.\nઉત્તર-દક્ષિણ ધ્રુવ.\nહોકાયંત્ર, મોટર, ડાયનેમો.\nસમાન ધ્રુવ દૂર, વિષમ નજીક.\nકુદરતી અને કૃત્રિમ."},
{name:"ઇલેક્ટ્રોમેગ્નેટ",icon:"⚡",use:"વિદ્યુતથી ચુંબકત્વ ઉત્પન્ન.\nપ્રવાહ બંધ થતાં ચુંબકત્વ જાય.\nક્રેન, ઘંટ, રિલેમાં.\nકોઇલ + લોખંડનું અંતઃકેન્દ્ર.\nઔદ્યોગિક અને ઘરેલું ઉપયોગ."},
{name:"સોલાર પેનલ",icon:"☀️",use:"સૂર્યપ્રકાશને વિદ્યુતમાં ફેરવવા.\nપુનઃપ્રાપ્ય ઊર્જા સ્ત્રોત.\nફોટોવોલ્ટેઇક કોષો.\nઘર, કેલ્ક્યુલેટર, ઉપગ્રહ.\nપર્યાવરણ મૈત્રીપૂર્ણ."},
{name:"એનિમોમીટર",icon:"🌬️",use:"પવનની ઝડપ માપવા.\nહવામાન સ્ટેશનમાં.\nકપ અથવા પ્રોપેલર પ્રકાર.\nkm/h અથવા m/sમાં.\nવાવાઝોડા અને ઉડ્ડયનમાં."},
{name:"રેઈન ગેજ",icon:"🌧️",use:"વરસાદની માત્રા માપવા.\nmmમાં વાંચન.\nનળાકાર પાત્ર + માપન સ્કેલ.\nહવામાન વિભાગનું સાધન.\nકૃષિ અને પૂર આગાહી."},
{name:"ગ્લોબ",icon:"🌍",use:"પૃથ્વીનું ત્રિ-પરિમાણીય મોડલ.\nખંડ, મહાસાગર, દેશ.\nધરી 23½° નમેલી — ઋતુઓ.\nભૂગોળ શિક્ષણનું ઉત્તમ સાધન.\nરોટેશન અને રિવોલ્યુશન સમજાવે."},
{name:"નકશો",icon:"🗺️",use:"સપાટ કાગળ પર પૃથ્વી/પ્રદેશ.\nસ્કેલ, દિશા, સંકેત.\nરસ્તા, નદી, પહાડ દર્શાવે.\nયાત્રા અને અભ્યાસમાં.\nરાજનીતિક અને ભૌગોલિક પ્રકાર."},
{name:"કેલ્ક્યુલેટર",icon:"🔢",use:"ઝડપી અને ચોક્કસ ગણતરી.\nસરવાળો, ગુણાકાર, વર્ગમૂળ.\nવૈજ્ઞાનિક મોડલમાં સાઇન-કોસ.\nશાળા અને દુકાન બંનેમાં.\nબેટરી અથવા સોલાર."},
{name:"કમ્પ્યુટર",icon:"💻",use:"માહિતી સંગ્રહ અને પ્રક્રિયા.\nશિક્ષણ, સંશોધન, મનોરંજન.\nબાઈનરી ભાષા — 0 અને 1.\nહાર્ડવેર + સોફ્ટવેર.\nઆધુનિક યુગનું મુખ્ય સાધન."},
{name:"પ્રોજેક્ટર",icon:"📽️",use:"છબી/સ્લાઇડ મોટી કરી દીવાલ પર.\nવર્ગ અને મીટિંગમાં.\nLCD / LED ટેક્નોલોજી.\nશિક્ષણને દૃશ્યમાન બનાવે.\nઅંધારું વાતાવરણ સારું."},
{name:"સ્પીકર",icon:"🔊",use:"વિદ્યુત સંકેતને અવાજમાં ફેરવવા.\nસંગીત, ઘોષણા, પ્રયોગ.\nમેગ્નેટ અને કોઇલની મદદ.\nઘરથી સ્ટેડિયમ સુધી.\nવોલ્યુમ નિયંત્રણ સાથે."},
{name:"માઈક્રોફોન",icon:"🎤",use:"અવાજને વિદ્યુત સંકેતમાં ફેરવવા.\nરેકોર્ડિંગ અને સ્પીકર સિસ્ટમ.\nડાયાફ્રેમની કંપન.\nગાયન, ભાષણ, વિજ્ઞાન પ્રયોગ.\nસ્પીકરનો ઊલટો કાર્ય."},
{name:"કેમેરા",icon:"📷",use:"પ્રકાશથી છબી પકડવા.\nલેન્સ + સેન્સર / ફિલ્મ.\nવિજ્ઞાનમાં અવલોકન નોંધ.\nમોબાઇલથી DSLR સુધી.\nસમય અને સ્થળ કાયમી."},
{name:"GPS",icon:"📍",use:"ઉપગ્રહથી સ્થાન નક્કી કરવા.\nઅક્ષાંશ-રેખાંશ આપે.\nનેવિગેશન, નકશો, બચાવ કાર્ય.\nમોબાઇલ અને વાહનમાં.\nવૈશ્વિક પોઝિશનિંગ સિસ્ટમ."},
{name:"કેલરીએમીટર",icon:"🥣",use:"ઉષ્મા માત્રા માપવા.\nઉષ્માસંબંધી પ્રયોગો.\nઇન્સ્યુલેટેડ પાત્ર.\nદળ × ઉષ્માધારિતા × ΔT.\nભૌતિકી પ્રયોગશાળા."},
{name:"ગેલ્વેનોમીટર",icon:"📉",use:"ખૂબ નાનો વિદ્યુત પ્રવાહ શોધવા.\nસંવેદનશીલ મીટર.\nએમીટર-વોલ્ટમીટરનો આધાર.\nદિશા અને માત્રા બતાવે.\nવિદ્યુત પ્રયોગમાં."},
{name:"રેઝિસ્ટર",icon:"📶",use:"પ્રવાહને નિયંત્રિત પ્રતિરોધ.\nઓહ્મ (Ω)માં માપ.\nસર્કિટમાં વોલ્ટેજ વહેંચણી.\nફિક્સ્ડ અને વેરિએબલ.\nઓહ્મના નિયમનો આધાર."},
{name:"સ્લાઇડ (માઈક્રો)",icon:"🧫",use:"નમૂનો માઈક્રોસ્કોપ હેઠળ રાખવા.\nપાતળો કાચનો ટુકડો.\nકવર સ્લિપથી ઢાંકાય.\nકોષ, પરાગ, પાણીના જીવ.\nસ્વચ્છ અને પાતળો નમૂનો."},
{name:"પિપેટ",icon:"💧",use:"ચોક્કસ કદનું પ્રવાહી માપી લેવા.\nmlમાં અંકિત.\nરસાયણ વિશ્લેષણમાં.\nમોંથી ન ચૂસો — પિપેટ ફિલર.\nચોક્કસતા માટે મેનિસ્કસ."},
{name:"ઇલેક્ટ્રોમીટર",icon:"⚡",use:"સ્થિર વિદ્યુત આવેશ માપવા-શોધવા.\nસોનાના પાંદડાનું અથવા ડિજિટલ.\nઆવેશની હાજરી બતાવે.\nસ્થિર વિદ્યુત પ્રયોગો.\nશાળામાં સાદું પાંદડા વાળું."},
{name:"સ્ફિગ્મોમેનોમીટર",icon:"💉",use:"બ્લડ પ્રેશર (રક્તદબાણ) માપવા.\nmmHgમાં સિસ્ટોલિક/ડાયસ્ટોલિક.\nકફ + મેનોમીટર + સ્ટેથોસ્કોપ.\nઆરોગ્ય તપાસનું મુખ્ય સાધન.\nસામાન્ય ≈ 120/80 mmHg."},
{name:"વાયર ગોઝ",icon:"🔲",use:"બીકરને સમાન ગરમી આપવા.\nત્રિપાદ પર મૂકાય.\nલોખંડની જાળી + એસ્બેસ્ટોસ કેન્દ્ર.\nસીધી જ્યોતથી કાચ ન તૂટે.\nપ્રયોગશાળા સુરક્ષા સાધન."}
